<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LIPPOLIS PT</title>
<!-- ====== PWA ====== -->
<meta name="theme-color" content="#E1E2E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LIPPOLIS PT">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#34373C;
    --device:#E1E2E3; --veil:rgba(236,240,238,.58); --surface:#F5F6F7; --surface2:#E9EAEC;
    --line:#BFC2C6; --line-soft:#D4D7DA;
    --text:#1B1F24; --muted:#5C616A; --muted2:#888D94;
    --accent:#12C7A2; --accent-rgb:18,199,162; --accent-2:#17E0BD; --accent-dark:#0AA888; --accent-btn:#04231B; --accent-ink:#0A8C72; --accent-soft:rgba(var(--accent-rgb),.13);
    --on-accent:#04231B;
    --warn:#B9761A; --warn-soft:rgba(185,118,26,.14);
    --danger:#D85046; --danger-ink:#B03A31;
    --up:#1FA971; --up-rgb:31,169,113; --up-ink:#0E7A50;
    --sg-down:#E02424; --sg-down-rgb:224,36,36; --sg-down-ink:#B91C1C;
    --shadow-card:0 1px 2px rgba(20,24,28,.07), 0 8px 22px rgba(20,24,28,.09);
    --r:16px;
  }
  /* Tema scuro: antracite, con lo stesso verde del brand */
  html[data-tema="scuro"]{
    --device:#1B1D20; --veil:rgba(22,24,27,.55); --surface:#26292E; --surface2:#2F3339;
    --line:#41464D; --line-soft:#363B41;
    --text:#ECEEF0; --muted:#A6ACB4; --muted2:#7C838B;
    --accent:#12C7A2; --accent-2:#17E0BD; --accent-dark:#0AA888; --accent-btn:#04231B; --accent-ink:#4FE0C2; --accent-soft:rgba(var(--accent-rgb),.15);
    --on-accent:#04231B;
    --warn:#E0A44A; --warn-soft:rgba(224,164,74,.16);
    --danger:#E8695F; --danger-ink:#FF9C93;
    --up:#2ECC8F; --up-rgb:46,204,143; --up-ink:#5FE3AE;
    --sg-down:#FF3B3B; --sg-down-rgb:255,59,59; --sg-down-ink:#FF6B6B;
    --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.30);
  }
  html[data-tema="scuro"] .ab .bx{border-color:var(--line);}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Manrope',system-ui,sans-serif; color:var(--text); background:var(--device); overflow:hidden; overscroll-behavior:none; -webkit-tap-highlight-color:transparent;}
  /* App a tutto schermo: occupa il display reale, rispettando notch e barra di navigazione */
  .phone{width:100%; max-width:560px; height:100%; margin:0 auto; background:radial-gradient(620px 520px at 100% -8%, rgba(var(--accent-rgb),.22), transparent 62%), radial-gradient(560px 460px at -12% 108%, rgba(var(--accent-rgb),.14), transparent 60%), linear-gradient(var(--veil),var(--veil)), url("sfondo.jpg") center/cover no-repeat, var(--device); overflow:hidden; display:flex; flex-direction:column; position:relative; padding-top:env(safe-area-inset-top, 0px);}
  @media (min-width:600px){ body{background:var(--bg);} .phone{box-shadow:0 0 60px rgba(0,0,0,.35);} }
  @media (min-width:900px){
    html:not([data-tema="scuro"]) .phone{--device:#F2F6F4;--veil:rgba(242,246,244,.60);--surface:#fff;--surface2:#EAF2EF;--line:#DCE5E2;--line-soft:#E7EEEB;--text:#13211F;--muted:#687572;--muted2:#87928F;}
    body{background:var(--device);overflow:hidden;}
    .phone{max-width:none;width:100%;height:100%;min-height:0;margin:0;border-radius:0;box-shadow:none;}
    .topbar{min-height:72px;padding:12px 28px;background:#101817;}
    .topbar .name{color:#fff;}
    .topbar .identity{color:#adbbb7;}
    .topbar .identity b{color:#fff;}
    .topbar .account-tools{margin-left:auto;}
    .topbar .account-exit{border-color:#40504c;background:transparent;color:#fff;}
    .view{width:100%;padding:18px clamp(24px,4vw,72px) 28px;}
  }

  .topbar{display:flex; align-items:center; gap:10px; padding:8px 20px 12px;}
  .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#23262B; box-shadow:var(--shadow-card);}
  .logo svg{width:20px;height:20px;}
  .topbar .name{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:15px; letter-spacing:1.5px; color:var(--text);}
  .topbar .name b{color:var(--accent-ink);}
  .topbar .avatar{margin-left:0; width:34px;height:34px;border-radius:50%; background:linear-gradient(150deg,var(--accent),var(--accent-dark)); display:grid;place-items:center; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:14px; color:var(--on-accent); box-shadow:var(--shadow-card); cursor:pointer;}
  .topbar .identity{text-align:right;font-size:11px;line-height:1.35;color:var(--muted);}
  .topbar .identity b,.topbar .identity span{display:block;}
  .topbar .identity b{color:var(--text);font-size:12px;}
  .topbar .account-tools{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .topbar .account-exit{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:8px 11px;font:700 12px 'Manrope',system-ui,sans-serif;cursor:pointer;white-space:nowrap;}
  .topbar .account-exit svg{width:16px;height:16px;}
  .topbar .account-exit[hidden]{display:none;}
  .topbar .account-switch{padding:8px 9px;}
  .pf-save-status{min-height:18px;margin:6px 2px 12px;color:var(--muted);font-size:11px;font-weight:700;}
  .pf-save-status.error{color:var(--danger-ink);}
  .password-modal{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,17,15,.58);}
  .password-modal.show{display:flex;}
  .password-dialog{width:min(460px,100%);max-height:92%;overflow:auto;padding:22px;border-radius:20px;background:var(--device);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.28);}
  .password-dialog h2{font:800 20px 'Archivo',system-ui,sans-serif;margin-bottom:6px;}
  .password-dialog p{font-size:12px;line-height:1.5;color:var(--muted);margin-bottom:12px;}
  .password-dialog .pf-field{margin-bottom:10px;}
  .password-feedback{display:none;margin:10px 0;padding:10px 12px;border-radius:11px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);}
  .password-feedback.show{display:block;}
  .password-feedback.error{background:rgba(216,80,70,.1);color:var(--danger-ink);}
  @media (max-width:899px){.topbar .identity{display:none}.topbar .avatar{margin-left:0}}
  @media (max-width:380px){.topbar .account-exit{padding:8px}.topbar .account-exit span{display:none}}

  .view{flex:1; overflow-y:auto; padding:6px 16px 24px; scrollbar-width:thin; scrollbar-color:#9aa0a8 transparent;}
  .view::-webkit-scrollbar{width:6px;} .view::-webkit-scrollbar-thumb{background:#a9adb3; border-radius:3px;}
  .notification-activation{flex:none;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;margin:0 16px 8px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--accent-dark);border-radius:12px;background:var(--surface);color:var(--text);}
  .notification-activation[hidden]{display:none;}
  .notification-activation h2{font:800 15px 'Archivo',system-ui,sans-serif;}
  .notification-activation p{margin-top:3px;color:var(--muted);font-size:13px;line-height:1.35;}
  .notification-activation .btn-accent{width:auto;margin:0;padding:8px 14px;min-height:40px;font-size:13px;border-radius:9px;}
  .notification-activation button:disabled{opacity:.65;cursor:wait;}
  @media(min-width:900px){.notification-activation{margin-inline:28px;}}
  @media(max-width:560px){.notification-activation .btn-accent{width:100%;}}

  .pagetitle{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:24px; color:var(--text); margin:6px 2px 4px;}
  .pagesub{font-size:12.5px; color:var(--muted); margin:0 2px 10px; font-weight:600;}

  /* ---- WORKOUT: calendario settimana ---- */
  .weekstrip{display:flex; gap:6px; margin:12px 0 20px;}
  .wd{flex:1; text-align:center; padding:9px 0 8px; border-radius:14px; background:var(--surface); border:1px solid var(--line-soft); box-shadow:var(--shadow-card);}
  .wd .dow{font-size:10px; font-weight:800; color:var(--muted2); text-transform:uppercase; letter-spacing:.3px;}
  .wd .dnum{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:16px; color:var(--text); margin-top:2px; line-height:1;}
  .wd .dot{width:5px;height:5px;border-radius:50%; background:var(--accent); margin:5px auto 0;}
  .wd.rest .dot{visibility:hidden;}
  .wd.today{background:var(--accent); border-color:var(--accent);}
  .wd.today .dow,.wd.today .dnum{color:var(--on-accent);}
  .wd.today .dot{background:var(--on-accent);}

  .dcard{display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow-card); cursor:pointer; transition:.15s; margin-bottom:10px; opacity:0; transform:translateY(8px); animation:rise .45s forwards;}
  .dcard:active{transform:scale(.99);}
  .dcard.today{border-color:rgba(var(--accent-rgb),.5);}
  .dcard .date{flex:0 0 auto; width:42px; text-align:center;}
  .dcard .date .dow{font-size:10px; font-weight:800; color:var(--muted2); text-transform:uppercase;}
  .dcard .date .dnum{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:21px; color:var(--text); line-height:1;}
  .dcard.today .date .dnum{color:var(--accent-ink);}
  .dcard .vline{width:1px; align-self:stretch; background:var(--line-soft); margin:3px 0;}
  .dcard .info{flex:1; min-width:0;}
  .dcard .info .todaytag{display:inline-block; background:var(--accent); color:var(--on-accent); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:9px; letter-spacing:.8px; padding:2px 7px; border-radius:6px; margin-bottom:6px;}
  .dcard .info .nm{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:18px; color:var(--text); line-height:1.1;}
  .dcard .info .sub{font-size:12px; color:var(--muted); font-weight:600; margin-top:5px; display:flex; align-items:center; gap:6px;}
  .dcard .info .sub svg{width:14px;height:14px; color:var(--muted2);}
  .dcard .go{flex:0 0 auto; width:42px;height:42px;border-radius:12px; background:var(--accent); color:var(--on-accent); display:grid;place-items:center;}
  .dcard .go svg{width:20px;height:20px;}

  .rrow{display:flex; align-items:center; gap:13px; padding:8px 14px; margin-bottom:10px;}
  .rrow .date{flex:0 0 auto; width:42px; text-align:center;}
  .rrow .date .dow{font-size:10px; font-weight:800; color:var(--muted2); text-transform:uppercase;}
  .rrow .date .dnum{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:21px; color:#aeb3ba; line-height:1;}
  .rrow .rest{font-size:13px; color:var(--muted2); font-weight:700; display:flex; align-items:center; gap:7px;}
  .rrow .rest::before{content:""; width:6px;height:6px;border-radius:50%; background:#c4c8cd;}

  /* ---- WORKOUT: dettaglio ---- */
  .progmeta{font-size:12.5px; color:var(--muted); margin-top:4px; font-weight:600; letter-spacing:.2px;}
  .weekrow{display:flex; align-items:center; gap:8px; margin:16px 0 12px;}
  .pill{background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap; box-shadow:var(--shadow-card);}
  .pill .chev{font-size:10px; color:var(--muted2);}
  .days{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .day{flex:0 0 auto; min-width:64px; text-align:center; padding:9px 12px; border-radius:13px; background:var(--surface); border:1px solid var(--line); cursor:pointer; transition:.18s; box-shadow:var(--shadow-card);}
  .day .dn{font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.6px; text-transform:uppercase;}
  .day .dt{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:14px; margin-top:3px; color:var(--text);}
  .day.active{background:var(--accent); border-color:var(--accent);}
  .day.active .dn,.day.active .dt{color:var(--on-accent);}
  .day.done-dot{position:relative;}
  .day.done-dot::after{content:""; position:absolute; top:7px; right:8px; width:6px;height:6px;border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--surface);}
  .progwrap{padding:4px 0 6px;}
  .barrow{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  .barrow b{color:var(--text);}
  .bar{height:7px; border-radius:99px; background:#D6D8DA; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .bar > i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s cubic-bezier(.2,.8,.2,1);}

  .ss-group{position:relative; margin:30px 0 16px; padding:16px 12px 12px; background:var(--accent-soft); border:1px solid rgba(var(--accent-rgb),.3); border-left:4px solid var(--accent); border-radius:18px;}
  .ss-tag{position:absolute; left:14px; top:-11px; z-index:3; background:var(--accent); color:var(--on-accent); font-family:'Archivo',system-ui,sans-serif; font-size:10px; font-weight:800; letter-spacing:1.4px; padding:3px 11px; border-radius:7px; box-shadow:0 4px 10px rgba(var(--accent-rgb),.4); display:flex; align-items:center; gap:5px;}
  .ss-group .card{margin:0 0 9px; box-shadow:0 1px 2px rgba(20,24,28,.05);}
  .ss-group .card:last-child{margin-bottom:0;}

  .card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r); padding:13px 13px 11px; transition:border-color .2s, box-shadow .2s; margin-bottom:13px; box-shadow:var(--shadow-card); opacity:0; transform:translateY(10px); animation:rise .5s forwards;}
  @keyframes rise{to{opacity:1; transform:none;}}
  .card.done{border:1.5px solid var(--accent); background:linear-gradient(135deg,rgba(var(--accent-rgb),.42),rgba(var(--accent-rgb),.2) 65%,rgba(var(--accent-rgb),.14)),var(--surface); box-shadow:0 6px 18px rgba(var(--accent-rgb),.28);}
  /* Esercizio completato: tutti i riquadri interni prendono il colore principale, più tenue (niente grigi) */
  .card.done :is(.tg,.set .field,.duo-btn,.note,.cnote-ta,.exercise-history,.del-set-btn,.add-set-btn,.sugg-apply){background:rgba(var(--accent-rgb),.16); border-color:rgba(var(--accent-rgb),.38);}
  .card.done .sc-table td{background:rgba(var(--accent-rgb),.12); border-bottom-color:rgba(var(--accent-rgb),.25);}
  .card.done .sc-table td:first-child{background:rgba(var(--accent-rgb),.3);}
  .card.done .note{border-left-color:var(--accent);}
  .card.done .badge{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
  .card.done .ex-sum{color:var(--text);}
  .card-top{display:flex; align-items:center; gap:11px; cursor:pointer;}
  .card-caret{flex:0 0 auto; color:var(--muted2); display:grid; place-items:center; transition:transform .2s;}
  .card-caret svg{width:18px;height:18px;}
  .card.open .card-caret{transform:rotate(90deg);}
  .card-body{display:none; padding-top:12px;}
  .card.open .card-body{display:block;}
  .ex-sum{color:var(--accent-ink); font-weight:800;}
  .badge{flex:0 0 auto; width:34px;height:34px;border-radius:10px; display:grid;place-items:center; background:var(--accent-soft); color:var(--accent-ink); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:14px; border:1px solid rgba(var(--accent-rgb),.35);}
  .badge.cardio{background:var(--warn-soft); color:var(--warn); border-color:rgba(185,118,26,.35);}
  .ex-main{flex:1; min-width:0;}
  .ex-name{font-weight:700; font-size:15px; line-height:1.25; color:var(--text);}
  .ex-muscle{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:2px;}
  .chk{flex:0 0 auto; width:30px;height:30px;border-radius:50%; border:2px solid var(--line); background:var(--surface); cursor:pointer; display:grid; place-items:center; transition:.18s; margin-top:2px; color:var(--text);}
  .chk svg{width:15px;height:15px; opacity:0; transform:scale(.5); transition:.18s;}
  .card.done .chk{background:var(--accent); border-color:var(--accent); color:var(--on-accent); box-shadow:0 0 0 4px rgba(var(--accent-rgb),.25);}
  .card.done .chk svg{opacity:1; transform:none;}
  .targets{display:flex; gap:7px; flex-wrap:nowrap; overflow-x:auto; margin:11px 0 0; scrollbar-width:none; -ms-overflow-style:none;}
  .targets::-webkit-scrollbar{display:none;}
  .targets > *{flex:0 0 auto;}
  .tg{background:var(--surface2); border:1px solid var(--line-soft); border-radius:9px; padding:6px 9px; font-size:11.5px; color:var(--muted); font-weight:600;}
  .tg b{color:var(--text); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:13px;}
  .tg.big b{color:var(--warn);}
  .tg-timer{ -webkit-appearance:none; appearance:none; font:inherit; cursor:pointer; border:1.5px solid var(--accent); background:var(--accent-soft); display:inline-flex; align-items:center; gap:5px; }
  .tg-timer b{color:var(--accent-ink);}
  .tg-timer svg{width:13px;height:13px; color:var(--accent-ink); flex:0 0 auto;}
  .tg-timer:active{transform:scale(.97);}
  /* Serie · Reps · RIR occupano tutta la riga, larghi quanto la barra del recupero sotto */
  .targets.targets-fill > *{flex:1 1 auto; text-align:center; justify-content:center;}
  .rec-bar{display:flex; justify-content:center; align-items:center; gap:9px; width:100%; margin-top:8px; padding:10px 14px; border-radius:11px; font-size:13px; font-weight:800; color:var(--accent-ink);}
  .rec-bar span{letter-spacing:.08em; text-transform:uppercase;}
  .rec-bar b{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:15px;}
  .rec-bar svg{width:15px;height:15px;}

  /* storico pesi (card nell'esercizio + pagina) */
  .storico-card{margin-top:11px; background:var(--surface2); border:1px solid var(--line-soft); border-radius:12px; padding:11px 12px; cursor:pointer; transition:.15s;}
  .storico-card:active{transform:scale(.995);}
  .sc-head{display:flex; align-items:center; gap:9px; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:14px; color:var(--text);}
  .sc-head span{flex:1;}
  .sc-head .scico,.sc-head .scchev{display:inline-flex; flex:0 0 auto;}
  .sc-head .scico svg{width:18px;height:18px; color:var(--accent-ink);}
  .sc-head .scchev svg{width:16px;height:16px; color:var(--muted2);}
  .sc-date{font-size:12px; color:var(--muted); font-weight:700; margin:9px 0 8px; padding-top:9px; border-top:1px solid var(--line-soft);}
  .sc-table{width:100%; border-collapse:separate; border-spacing:0; border-radius:9px; overflow:hidden; font-size:12.5px;}
  .sc-table th{background:var(--accent); color:var(--on-accent); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:11px; padding:8px 6px; text-align:center;}
  .sc-table td{background:var(--surface); padding:9px 6px; text-align:center; font-weight:700; color:var(--text); border-bottom:1px solid var(--line-soft);}
  .sc-table td:first-child{background:var(--accent-soft); color:var(--accent-ink); font-family:'Archivo',system-ui,sans-serif; font-weight:800;}
  .sc-table tr:last-child td{border-bottom:0;}
  .stor-block{margin-bottom:18px;}
  .stor-date{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:16px; color:var(--text); margin-bottom:8px;}

  /* timer recupero / esercizio a tempo */
  .timerbar{position:absolute; left:12px; right:12px; bottom:calc(80px + env(safe-area-inset-bottom, 0px)); z-index:20; background:var(--accent); border-radius:16px; padding:12px 14px; box-shadow:0 12px 30px rgba(var(--accent-rgb),.45); color:var(--on-accent); animation:tbpop .25s ease;}
  @keyframes tbpop{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
  .timerbar.done{background:var(--danger); box-shadow:0 12px 30px rgba(216,80,70,.5); color:#fff; animation:tbflash .55s ease infinite alternate;}
  @keyframes tbflash{from{filter:brightness(1);} to{filter:brightness(1.2);}}
  .timerbar.last3 .tb-time{animation:tbpulse 1s ease-out infinite;}
  @keyframes tbpulse{0%{transform:scale(1.18);} 60%{transform:scale(1);} 100%{transform:scale(1);}}
  .tb-time{transform-origin:left center;}
  .vol-row{display:flex; align-items:center; gap:12px; padding:12px 2px 14px; border-bottom:1px solid var(--line-soft);}
  .vol-row input[type=range]{flex:1; accent-color:var(--accent); height:28px;}
  .vol-row .vol-v{min-width:42px; text-align:right; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:15px; color:var(--text);}
  .vol-prova{-webkit-appearance:none; appearance:none; font:inherit; font-size:13px; font-weight:700; border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--accent-ink); border-radius:10px; padding:7px 12px; cursor:pointer;}
  .vol-hint{font-size:12px; color:var(--muted2); margin:8px 2px 0; line-height:1.4;}
  .tb-main{display:flex; align-items:center; gap:10px;}
  .tb-info{flex:1; min-width:0;}
  .tb-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-time{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:26px; line-height:1.05; margin-top:2px;}
  .tb-ctrls{display:flex; align-items:center; gap:7px; flex:0 0 auto;}
  .tb-b{display:grid; place-items:center; min-width:38px; height:38px; padding:0 10px; border-radius:11px; border:0; background:rgba(4,35,27,.14); color:inherit; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:12px; cursor:pointer;}
  .tb-b svg{width:18px;height:18px;}
  .tb-b.stop{background:rgba(4,35,27,.22);}
  .timerbar.done .tb-b{background:rgba(255,255,255,.22);}
  .tb-track{height:5px; border-radius:3px; background:rgba(4,35,27,.16); margin-top:10px; overflow:hidden;}
  .tb-fill{height:100%; background:var(--on-accent); border-radius:3px; transition:width .9s linear;}
  .timerbar.done .tb-track{background:rgba(255,255,255,.25);}
  .timerbar.done .tb-fill{background:#fff;}
  .note{margin-top:10px; font-size:12px; color:#5a5f66; line-height:1.45; padding:9px 11px; background:var(--surface2); border-radius:10px; border-left:2px solid var(--line);}
  .note .nl{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:var(--accent-ink); margin-right:7px;}
  .hist{margin-top:9px; font-size:11.5px; color:var(--muted); font-weight:600; background:rgba(var(--accent-rgb),.07); border:1px solid rgba(var(--accent-rgb),.18); border-radius:9px; padding:7px 10px; line-height:1.45;}
  .hist .hl{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--accent-ink); margin-right:7px;}
  .sets{margin-top:11px; display:flex; flex-direction:column; gap:6px;}
  .set{display:flex; align-items:center; gap:7px;}
  .set .sl{width:38px; font-size:11px; font-weight:700; color:var(--muted2); letter-spacing:.4px;}
  .set .sl small{display:block; font-size:10px; color:var(--accent-ink); letter-spacing:.6px;}
  .set.lato-sx{margin-bottom:5px;}
  .set .field{flex:1; display:flex; align-items:center; gap:4px; background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:5px 8px;}
  .set .field input{flex:1; width:100%; background:transparent; border:0; outline:none; color:var(--text); font-family:'Archivo',system-ui,sans-serif; font-weight:700; font-size:14px;}
  .set .field input::placeholder{color:var(--muted2); font-family:'Manrope',sans-serif; font-weight:600;}
  .set .field span{font-size:11px; color:var(--muted2); font-weight:700;}
  .set .field:focus-within{border-color:var(--accent); background:var(--surface);}
  .set .f-rir{flex:0 0 62px;}
  .set .f-rir.ok{border-color:var(--accent); background:var(--accent-soft);}
  .set .f-rir.ok input,.set .f-rir.ok span{color:var(--accent-ink);}
  .set .f-rir.warn{border-color:#E0A82E; background:#FBF3DC;}
  .set .f-rir.warn input,.set .f-rir.warn span{color:#8F6B0F;}
  /* ===== Suggerimenti progressione carichi ===== */
  .sugg{margin-top:10px;}
  .sugg-top{display:flex; align-items:center; gap:8px;}
  .sugg-l{display:inline-flex; align-items:center; gap:6px; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:10.5px; letter-spacing:1.1px; text-transform:uppercase; color:var(--accent-ink);}
  .sugg-l svg{width:13px; height:13px;}
  .sugg-q{-webkit-appearance:none; appearance:none; border:0; margin-left:auto; width:17px; height:17px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;}
  .sugg-apply{-webkit-appearance:none; appearance:none; border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink); border-radius:999px; padding:4px 11px; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:11px; letter-spacing:.4px; cursor:pointer; flex:0 0 auto;}
  .sugg-apply:active{transform:scale(.97);}
  .sugg-head{margin:7px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45;}
  .sugg-table{margin-top:8px;}
  .sugg-table th:nth-child(1),.sugg-table td:nth-child(1){width:44px;}
  .sugg-table th:nth-child(3),.sugg-table td:nth-child(3){width:44px;}
  .sugg-table th:nth-child(5),.sugg-table td:nth-child(5){width:34px; padding-left:0;}
  .sugg-table td{padding:7px 4px;}
  .sugg-table .sg{display:inline-block; padding:4px 8px; font-size:11px;}
  tr.sgrow{cursor:pointer;}
  tr.sgrow.nofill{cursor:default;}
  .sgadd{color:var(--accent-ink);}
  .sgadd svg{width:14px; height:14px; vertical-align:middle;}
  .okd{display:inline-flex; width:19px; height:19px; border-radius:50%; background:var(--accent); color:#fff; align-items:center; justify-content:center;}
  .okd svg{width:11px; height:11px;}
  tr.sgrow.done td:first-child{background:var(--accent); color:#fff;}
  .sg{font-family:'Archivo',system-ui,sans-serif; font-size:11.5px; font-weight:800; padding:5px 9px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:#5a5f66; white-space:nowrap;}
  .pf-fold > summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between;}
  .pf-fold > summary::-webkit-details-marker{display:none;}
  .pf-fold-i{display:inline-flex; color:var(--muted, #8a8f96); transition:transform .2s;}
  .pf-fold-i svg{width:18px; height:18px;}
  .pf-fold[open] .pf-fold-i{transform:rotate(90deg);}
  .sg.up,.sg.zav{background:rgba(var(--up-rgb),.12); border-color:var(--up); color:var(--up-ink);}
  .sg.down{background:rgba(var(--sg-down-rgb),.14); border-color:var(--sg-down); color:var(--sg-down-ink);}
  .sg.keep,.sg.push{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);}
  .sugg-hint{margin-top:8px; font-size:12px; color:#5a5f66; line-height:1.5; background:var(--surface2); border-radius:10px; padding:8px 10px;}
  .tg-rir{-webkit-appearance:none; appearance:none; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .tg-rir .q{width:14px; height:14px; border-radius:50%; background:var(--accent); color:#fff; font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; line-height:1; flex:0 0 auto;}
  .tg-rir:active{transform:scale(.97);}
  .rir-hint{margin:9px 0 0; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:9px 11px; font-size:12px; line-height:1.45; color:var(--text);}
  .rir-hint b{font-family:'Archivo',system-ui,sans-serif; font-weight:800; color:var(--accent-ink);}
  .feedback{margin:22px 2px 6px; background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r); padding:14px; box-shadow:var(--shadow-card);}
  .feedback h3{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:13px; letter-spacing:.4px; display:flex; align-items:center; gap:8px; margin-bottom:10px; color:var(--text);}
  .feedback h3 svg{width:16px;height:16px;color:var(--accent-ink);}
  .feedback textarea{width:100%; min-height:64px; resize:none; background:var(--surface2); border:1px solid var(--line); border-radius:11px; padding:10px 12px; color:var(--text); font-family:'Manrope',sans-serif; font-size:13px; outline:none;}
  .feedback textarea:focus{border-color:var(--accent); background:var(--surface);}
  .btn-accent{margin-top:10px; width:100%; padding:13px; border:0; border-radius:12px; background:var(--accent); color:var(--on-accent); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:14px; letter-spacing:.4px; cursor:pointer; transition:.18s;}
  .btn-accent:active{transform:scale(.99);}

  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:56vh; padding:0 24px;}
  .empty .ic{width:84px;height:84px;border-radius:24px; display:grid;place-items:center; background:var(--accent-soft); border:1px solid rgba(var(--accent-rgb),.25); margin-bottom:18px;}
  .empty .ic svg{width:40px;height:40px;color:var(--accent-ink);}
  .empty h2{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:19px; color:var(--text); margin-bottom:8px;}
  .empty p{font-size:13px; color:var(--muted); line-height:1.5; max-width:260px;}

  /* ---- ALTRO (menu) ---- */
  .menu{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .mcard{position:relative; overflow:hidden; background:linear-gradient(var(--accent-soft),var(--accent-soft)),color-mix(in srgb,var(--surface) 92%,transparent); border:1px solid rgba(var(--accent-rgb),.22); border-radius:18px; padding:26px 16px; cursor:pointer; transition:.16s; box-shadow:var(--shadow-card);}
  .mcard:active{transform:scale(.99);}
  .mcard .lbl{position:relative; z-index:2; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:18px; color:var(--accent-ink);}
  .mcard .big{position:absolute; right:-4px; top:50%; transform:translateY(-50%); opacity:.20; color:var(--accent-ink);}
  .mcard .big svg{width:92px;height:92px;}

  .dhead{display:flex; align-items:center; gap:12px; margin:4px 0 14px;}
  .back{width:36px;height:36px;border-radius:10px; display:grid;place-items:center; background:var(--surface); border:1px solid var(--line); cursor:pointer; color:var(--text); box-shadow:var(--shadow-card); flex:0 0 auto;}
  .back svg{width:18px;height:18px;}
  .dhead h2{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:22px; color:var(--text); line-height:1.1;}

  /* ---- PROFILO ---- */
  .pf-avatar{display:flex; justify-content:center; margin:8px 0 22px;}
  .pf-avatar .av{width:104px;height:104px;border-radius:50%; background:linear-gradient(150deg,var(--accent),var(--accent-dark)); display:grid;place-items:center; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:36px; color:var(--on-accent); position:relative; box-shadow:var(--shadow-card);}
  .pf-avatar .cam{position:absolute; right:-2px; bottom:-2px; width:34px;height:34px;border-radius:50%; background:var(--accent-ink); display:grid;place-items:center; border:3px solid var(--device);}
  .pf-avatar .cam svg{width:16px;height:16px;color:#fff;}
  .pf-avatar .av{cursor:pointer;}
  .pf-avatar .av.has-photo,.topbar .avatar.has-photo{background-size:cover;background-position:center;color:transparent;}
  .pf-foto-via{display:block;margin:-12px auto 18px;background:none;border:0;color:var(--muted,#888);font-size:13px;text-decoration:underline;cursor:pointer;}
  .pf-field{margin-bottom:14px;}
  .pf-field label{display:block; font-size:13px; color:var(--muted); font-weight:600; margin:0 2px 6px;}
  .pf-input{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 14px; font-size:15px; color:var(--text); font-weight:600; outline:none; box-shadow:var(--shadow-card);}
  .pf-input:focus{border-color:var(--accent);}
  .pf-input.ro{background:var(--surface2); color:var(--muted); box-shadow:none; cursor:not-allowed;}
  .pf-input.sel{display:flex; align-items:center; justify-content:space-between;}
  .pf-input.sel .chev{color:var(--muted2); font-size:12px;}
  .pf-sec{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:18px; color:var(--text); margin:22px 2px 12px;}
  .pf-row{display:flex; align-items:center; justify-content:space-between; padding:13px 2px; border-bottom:1px solid var(--line-soft);}
  .pf-row .t{font-size:15px; color:var(--text); font-weight:600;}
  .tgl{width:48px;height:28px;border-radius:99px; background:#c4c7cb; border:0; position:relative; cursor:pointer; transition:.18s; flex:0 0 auto;}
  .tgl::after{content:""; position:absolute; top:3px; left:3px; width:22px;height:22px;border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .tgl.on{background:var(--accent);}
  .tgl.on::after{left:23px;}
  .pf-link{display:flex; align-items:center; gap:11px; padding:14px 2px; font-size:15px; font-weight:600; cursor:pointer;}
  .pf-link svg{width:19px;height:19px;}
  .pf-link.danger{color:var(--danger);} .pf-link.danger svg{color:var(--danger);}

  .pdel{background:transparent;color:var(--danger-ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:700 12px 'Manrope',system-ui,sans-serif;cursor:pointer;}

  /* ---- METRICHE ---- */
  .metric{margin-bottom:24px;}
  .mhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px;}
  .mhead .mt{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:18px; color:var(--text);}
  .mhead .add{background:var(--accent); color:var(--on-accent); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:12px; padding:8px 14px; border-radius:10px; border:0; cursor:pointer; flex:0 0 auto;}
  .chartcard{background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:12px 10px 6px; box-shadow:var(--shadow-card);}
  .chartcard .onepoint{font-size:13px; color:var(--text); font-weight:600; padding:8px 4px;}
  .chartcard .onepoint b{font-family:'Archivo',system-ui,sans-serif;}
  .chartcard .onepoint .hint{font-size:11.5px; color:var(--muted2); font-weight:600; margin-top:6px;}
  .nodata{font-size:13px; color:var(--muted2); font-weight:600; padding:4px 2px;}

  /* ---- PLICHE ---- */
  .pliche{background:var(--surface); border:1px solid var(--line-soft); border-radius:18px; padding:16px 14px; box-shadow:var(--shadow-card); margin-bottom:26px;}
  .pl-title{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:18px; color:var(--text);}
  .pl-sub{font-size:12px; color:var(--muted); font-weight:600; margin-top:3px; margin-bottom:14px;}
  .pl-row2{display:flex; gap:10px; margin-bottom:14px;}
  .pl-f{flex:1;}
  .pl-f label{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px;}
  .pl-seg{display:flex; gap:6px;}
  .pl-seg button{flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--accent); background:transparent; color:var(--accent-ink); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:12px; cursor:pointer;}
  .pl-seg button.on{background:var(--accent); color:var(--on-accent);}
  .pl-in{width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; font-weight:700; color:var(--text); outline:none; font-family:'Archivo',system-ui,sans-serif;}
  .pl-in:focus{border-color:var(--accent);}
  .pl-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px;}
  .pl-site label{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:5px;}
  .b3{display:inline-grid; place-items:center; width:14px;height:14px; border-radius:4px; background:var(--accent); color:var(--on-accent); font-size:9px; font-weight:800; vertical-align:middle;}
  .pl-mm{display:flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
  .pl-mm input{flex:1; width:100%; background:transparent; border:0; outline:none; font-family:'Archivo',system-ui,sans-serif; font-weight:700; font-size:14px; color:var(--text);}
  .pl-mm span{font-size:11px; color:var(--muted2); font-weight:700;}
  .pl-mm:focus-within{border-color:var(--accent);}
  .pl-hint{font-size:11px; color:var(--muted2); font-weight:600; line-height:1.45; margin-bottom:14px;}
  .pl-cards{display:flex; gap:8px; margin-bottom:10px;}
  .pl-card{flex:1; background:var(--accent-soft); border:1px solid rgba(var(--accent-rgb),.25); border-radius:12px; padding:12px 8px; text-align:center;}
  .pl-card.avg{background:var(--surface2); border-color:var(--line-soft);}
  .pl-card .pl-k{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  .pl-card .pl-v{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:22px; color:var(--accent-ink); margin-top:4px;}
  .pl-card.avg .pl-v{color:var(--text);}
  .pl-cmp{font-size:12px; color:var(--muted); font-weight:600; line-height:1.5;}
  .pl-cmp b{color:var(--text); font-family:'Archivo',system-ui,sans-serif;}

  /* ---- SUB-TAB (Metriche: Pliche / Circonferenze) ---- */
  .subtabs{display:flex; gap:6px; margin:4px 0 18px; background:var(--surface2); border:1px solid var(--line-soft); border-radius:13px; padding:4px;}
  .subtabs button{flex:1; padding:10px 8px; border:0; border-radius:10px; background:transparent; color:var(--muted); font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:13.5px; letter-spacing:.3px; cursor:pointer; transition:.15s;}
  .subtabs button.on{background:var(--accent); color:var(--on-accent); box-shadow:var(--shadow-card);}

  /* ---- ELENCO STORICO PESI (tab Altro) ---- */
  .ex-hist-list{display:flex; flex-direction:column; gap:9px; margin-top:4px;}
  .ex-hist-row{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line-soft); border-radius:13px; padding:15px 15px; cursor:pointer; transition:.15s; box-shadow:var(--shadow-card);}
  .ex-hist-row:active{transform:scale(.99);}
  .ex-hist-row .ehn{flex:1; min-width:0; font-weight:700; font-size:14.5px; color:var(--text); line-height:1.25;}
  .ex-hist-row .ehc{flex:0 0 auto; color:var(--muted2); display:inline-flex;}
  .ex-hist-row .ehc svg{width:18px; height:18px;}

  /* ---- HOME ALLENAMENTO: dati fisici e programma ---- */
  .hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--accent),var(--accent-dark));border-radius:22px;padding:20px 18px;box-shadow:var(--shadow-card);margin:8px 0 24px;color:var(--on-accent);}
  .hero .hbig{position:absolute; right:-14px; bottom:-18px; opacity:.16; pointer-events:none;}
  .hero .hbig svg{width:128px; height:128px;}
  .hero .htitle{position:relative;z-index:2;font-family:'Archivo',system-ui,sans-serif;font-weight:900;font-size:clamp(22px,6vw,30px);line-height:1.12;margin:0;overflow-wrap:anywhere;}
  .hero .hmeta{position:relative;z-index:2;font-size:13px;font-weight:700;margin:7px 0 0;}
  .hero .hbtn{position:relative; z-index:2; margin-top:17px; width:100%; padding:14px; border:0; border-radius:13px; background:var(--accent-btn); color:#fff; font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:14.5px; letter-spacing:.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .hero .hbtn svg{width:18px; height:18px;}
  @media(min-width:900px){.hero .hbtn{width:auto;min-width:240px;}}
  .seclabel{font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:12px; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; margin:4px 2px 12px;}
  .upcard{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:11px 13px;box-shadow:var(--shadow-card);cursor:pointer;transition:.15s;font:inherit;text-align:left;}

  /* ---- DOCUMENTI (tab Altro) ---- */

<script>

    if(senzaScheda()) return 0;
    const k=dayKey(ts), S=PROGRAMMA.settimane;
    let i=S.findIndex(w=>k>=w.dal && k<=w.al);
    if(i<0) i = k<S[0].dal ? 0 : S.length-1;

    if(senzaScheda()){ settCorr=0; giorni=[]; stato = statoSett[0] || (statoSett[0]={}); return; }

    const key=versioneSchedaLocale?'v:'+versioneSchedaLocale+':'+i:i;
    stato = statoSett[key] || (statoSett[key]={});
    if(giornoCorr>=giorni.length) giornoCorr=0;

  // Le sessioni importate da CoachPlus hanno settimana e giorno del vecchio programma:
  // restano nello storico ma non fanno risultare già svolte le giornate del blocco in corso.
  // Eccezione: una sessione importata dello STESSO programma (stesso nome) e fatta dentro le date
  // di quella settimana conta come seduta svolta. Serve quando una scheda già iniziata altrove
  // (vecchio APK) viene pubblicata nell'app e il suo storico viene importato a parte.
  function dentroSettimana(ts, week){
    if(!Number.isFinite(Number(ts))||!week?.dal||!week?.al) return false;
    const da=new Date(week.dal+'T00:00:00').getTime(), a=new Date(week.al+'T23:59:59').getTime();
    return Number.isFinite(da)&&Number.isFinite(a)&&ts>=da&&ts<=a;
  }
  function sessioneDelGiorno(i, w){
    if(senzaScheda()) return null;
    const week=PROGRAMMA.settimane[w==null?settCorr:w], n=week.n;
    return sessioni.find(x=>x.settimana===n && x.giorno===i && (x.importata

    const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2;
    if(mx===mn) return [0,0,l];
    const d=mx-mn, sat=l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    let h;
    if(mx===r) h=((g-b)/d+(g<b?6:0))/6; else if(mx===g) h=((b-r)/d+2)/6; else h=((r-g)/d+4)/6;
    return [h,sat,l];
  }
  function hsl2hex(h,s,l){
    const f=n=>{ const k=(n+h*12)%12, a=s*Math.min(l,1-l), c=l-a*Math.max(-1,Math.min(k-3,9-k,1));
      return Math.round(c*255).toString(16).padStart(2,'0'); };
    return '#'+f(0)+f(8)+f(4);
  }
  // Dal colore scelto ricavo la variante chiara, quella leggibile sul fondo e il colore del testo sopra.
  function applicaAccento(){
    const a=(ACCENTI.find(x=>x.id===accento)||ACCENTI[0]).hex;
    const [r,g,b]=hex2rgb(a), [h,sa,l]=rgb2hsl(r,g,b);
    const lumRel=(rr,gg,bb)=>{ const f=c=>{ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
      return 0.2126*f(rr)+0.7152*f(gg)+0.0722*f(bb); };
    const contrasto=(l1,l2)=>(Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
    const Lacc=lumRel(r,g,b);
    const st=document.documentElement.style;
    st.setProperty('--accent', a);
    st.setProperty('--accent-rgb', r+','+g+','+b);
    st.setProperty('--accent-2', hsl2hex(h, sa, Math.min(0.82, l+0.08)));
    st.setProperty('--accent-dark', hsl2hex(h, sa, Math.max(0.16, l-0.16)));
    st.setProperty('--accent-btn', hsl2hex(h, Math.min(1, sa), 0.11));   // bottone scuro sulla card colorata
    st.setProperty('--accent-ink', tema==='scuro' ? hsl2hex(h, Math.min(1,sa*0.9), Math.max(0.62, Math.min(0.78, l+0.18)))
                                                  : hsl2hex(h, Math.min(1,sa*1.05), Math.max(0.22, Math.min(0.34, l-0.32))));
    st.setProperty('--accent-soft', 'rgba('+r+','+g+','+b+','+(tema==='scuro'?'.15':'.13')+')');
    // Testo sopra l'accento: sceglie fra scuro e bianco quello che si legge meglio davvero
    const scuro=hsl2hex(h, Math.min(1,sa), 0.12), [sr,sg,sb]=hex2rgb(scuro);
    const vinceScuro = contrasto(Lacc, lumRel(sr,sg,sb)) >= contrasto(Lacc, 1);
    st.setProperty('--on-accent', accento==='lippolis' ? '#04231B' : (vinceScuro ? scuro : '#FFFFFF'));
  }

  // ====== WORKOUT ======
  function exState(day, idx, n){ if(!stato[day])stato[day]={}; if(!stato[day][idx])stato[day][idx]={sets:Array.from({length:n},()=>({kg:'',reps:'',rir:''})),manual:false,note:''}; const _s=stato[day][idx]; while(_s.sets.length<n) _s.sets.push({kg:'',reps:'',rir:''}); return stato[day][idx]; }
  function valoreSerie(value){ if(value==null||String(value).trim()==='')return null; const n=Number(String(value).trim().replace(',','.')); return Number.isFinite(n)?n:null; }
  function serieACorpoLibero(ex,i){
    const index=isUnilat(ex)?Math.floor(i/2):i;
    return ex.prescriptions?.[index]?.load_unit==='bodyweight' || /^p\.?c\.?$/i.test(ex.carichiSerie?.[index]??ex.carico??'');
  }
  // Più valori nella stessa serie (drop set, rest-pause): ripetizioni «13,9», «13+9», «13 9»;
  // carichi «22,5/15», «22,5+15», «30,20». Nei kg la virgola resta decimale (22,5 · 1,25 · 17,50)
  // tranne quando dopo ci sono 2+ cifre che formano un numero più piccolo (30,20 = 30 poi 20).
  function partiReps(value){
    const t=String(value??'').replace(/\s*(ripetizioni|reps?|rip\.?)\s*$/i,'').trim(); if(!t) return null;
    const parts=t.split(/[\s,.+\/;\-]+/).filter(Boolean);
    return parts.length&&parts.every(p=>/^\d+$/.test(p)&&Number(p)>0)?parts.map(Number):null;
  }
  function partiKg(value){
    const t=String(value??'').replace(/\s*kg\b\.?/gi,'').trim(); if(!t) return null;
    if(/^(p\.?\s?c\.?|c\.?\s?l\.?|corpo libero)$/i.test(t)) return [0];
    const out=[];
    for(const chunk of t.split(/\s*[\/+;]\s*|\s*-\s*(?=\d)|\s+/).filter(Boolean)){
      const m=chunk.match(/^(\d+),(\d{2,})$/);
      if(m&&Number(m[2])<Number(m[1])){ out.push(Number(m[1]),Number(m[2])); continue; }
      const commas=chunk.split(',');
      if(commas.length>2){ if(!commas.every(x=>/^\d+$/.test(x)))return null; out.push(...commas.map(Number)); continue; }
      const n=valoreSerie(chunk); if(n===null||n<0) return null; out.push(n);
    }
    return out.length?out:null;
  }
  function leggiSerie(ex, set, i){
    const repsList=partiReps(set.reps), kgList=partiKg(set.kg), rir=valoreSerie(set.rir);
    const reps=repsList?repsList[0]:null, inputKg=kgList?kgList[0]:null;
    if(!repsList || (set.kg!==''&&set.kg!=null&&!kgList) || (inputKg===null&&!serieACorpoLibero(ex,i)&&!!ex.carico) || (set.rir!==''&&set.rir!=null&&(rir===null||rir<0||rir>10)))return null;
    const out={kg:inputKg??0,reps,rir};
    if(repsList.length>1) out.repsTesto=repsList.join(' + ');
    if(kgList&&kgList.length>1) out.kgTesto=kgList.map(fmtKgIt).join(' / ');
    return out;
  }
  function isDone(ex, st){ const n=Math.min(nSlot(ex),slotCount(ex,st)); return !!st.manual || (n>0 && st.sets.slice(0,n).every((s,i)=>!!leggiSerie(ex,s,i))); }
  function countDone(day){ let n=0; giorni[day].esercizi.forEach((ex,idx)=>{ if(isDone(ex, exState(day,idx,nSlot(ex)))) n++; }); return n; }

  function tsDi(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,12,0).getTime(); }

    renderDailyCheck();
  }
  const GG_BREVI=['dom','lun','mar','mer','gio','ven','sab'];
  function etichettaGiorno(k){
    const oggi=OGGI_KEY();
    if(k===oggi) return 'Oggi';
    const ieri=new Date(); ieri.setDate(ieri.getDate()-1);
    if(k===dayKey(ieri.getTime())) return 'Ieri';
    const d=new Date(tsDi(k));
    return GG_BREVI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()];
  }
  let gDraft = null;

  function giornata(k, crea){ if(!giornate[k] && crea) giornate[k]={h:{}}; const g=giornate[k]; if(g && !g.h) g.h={}; return g||null; }
  function sessioneDel(k){ return sessioni.some(s=>dayKey(s.ts)===k); }
  function pesataDel(k){ return pesi.some(p=>dayKey(p.ts)===k); }
  // Le abitudini collegate ad altri dati si spuntano da sole, ma restano modificabili a mano.
  function abFatta(a,k){
    const g=giornate[k];
    if(g && g.h && a.id in g.h) return !!g.h[a.id];
    if(a.auto==='sessione') return sessioneDel(k);
    if(a.auto==='peso') return pesataDel(k);
    return false;
  }
  function abContate(k){ return abitudini.filter(a=>abFatta(a,k)).length; }
  function abPerc(k){ return abitudini.length ? abContate(k)/abitudini.length : 0; }
  function haValori(g){ return !!(g && g.sonnoQ && g.energia && g.motivazione && g.doms); }

  function ckScore(g){ return ((g.sonnoQ/2) + g.energia + (6-g.doms) + g.motivazione)/4; }
  function ckZona(g){
    const s=ckScore(g);
    let z = s>=3.75 ? 'verde' : (s>=2.75 ? 'gialla' : 'rossa');
    // Poche ore di sonno non lasciano passare una giornata per "verde", per quanto ti senta bene.
    if(z==='verde' && g.sonnoOre!=null && g.sonnoOre<6) z='gialla';
    return z;
  }
  const CK_MSG={
    verde:'Zona verde: sei recuperato. Puoi spingere sulla progressione come da scheda.',
    gialla:'Zona gialla: recupero parziale. Allenati, ma resta sui carichi di riferimento senza forzare.',
    rossa:'Zona rossa: i segnali sono bassi. Riduci il volume e avvisa Vittorio.'
  };
  const CK_VOCI=[
    {k:'energia',     l:'Energia',     max:5},
    {k:'motivazione', l:'Motivazione', max:5},
    {k:'doms',        l:'DOMS',        max:5, hint:'5 = molto indolenzito'},
  ];

  function ckCard(){
    const k=KSEL(), g=giornate[k]||{h:{}};
    const wrap=document.createElement('div'); wrap.className='ck';
    const fatte=abContate(k), tot=abitudini.length;
    const z=haValori(g)?ckZona(g):null;
    const oggi=k===OGGI_KEY();
    let testa=`<div class="ck-nav">
        <button class="ck-fr" data-gg="-1" aria-label="Giorno precedente">${I.chevL}</button>
        <span class="ck-data${oggi?'':' ind'}">${etichettaGiorno(k)}</span>
        <button class="ck-fr" data-gg="1" ${oggi?'disabled':''} aria-label="Giorno successivo">${I.chevR}</button>
      </div>
      <div class="ck-top">
        <div class="ck-ic">${I.pulse}</div>
        <div class="ck-txt"><div class="ck-t">Check giornaliero</div>
          <div class="ck-s">${haValori(g)?`Sonno ${dec1(g.sonnoOre)}h · qualità ${g.sonnoQ}/10 · energia ${g.energia}/5 · abitudini ${fatte}/${tot}`:`Da compilare · abitudini ${fatte}/${tot}`}</div></div>
        <span class="ck-cta">${valoriOpen?'Chiudi':'Apri'}</span>
      </div>`;
    if(z && !valoriOpen) testa+=`<div class="ck-zone ${z}" style="margin-top:12px"><span class="dot"></span><span>${CK_MSG[z]}</span></div>`;

    let form='';
    if(valoriOpen){
      const dr=gDraft;
      const seg=(kk,max,val)=>{ let s=''; for(let n=1;n<=max;n++) s+=`<button class="${val===n?'on':''}" data-ck="${kk}" data-n="${n}">${n}</button>`; return s; };
      form=`<div class="ck-form">
        <div class="ck-row"><div class="ck-lab"><span class="l">Ore di sonno</span><span class="v">${dr.sonnoOre==null?'—':dec1(dr.sonnoOre)+' h'}</span></div>
          <div class="ck-step"><button data-ore="-0.5">−</button><div class="val">${dr.sonnoOre==null?'—':dec1(dr.sonnoOre)}</div><button data-ore="0.5">+</button></div></div>
        <div class="ck-row"><div class="ck-lab"><span class="l">Qualità del sonno</span><span class="v">${dr.sonnoQ||'—'}/10</span></div>
          <div class="ck-seg dieci">${seg('sonnoQ',10,dr.sonnoQ)}</div></div>
        ${CK_VOCI.map(v=>`<div class="ck-row"><div class="ck-lab"><span class="l">${v.l}</span><span class="v">${dr[v.k]||'—'}/${v.max}</span></div>
          <div class="ck-seg">${seg(v.k,v.max,dr[v.k])}</div>${v.hint?`<div class="ck-hint">${v.hint}</div>`:''}</div>`).join('')}
        ${haValori(dr)?`<div class="ck-zone ${ckZona(dr)}" id="ckZone"><span class="dot"></span><span>${CK_MSG[ckZona(dr)]}</span></div>`:''}
        <div class="sg-acts"><button class="ann" id="ckCancel">Annulla</button><button class="inv" id="ckSave" ${haValori(dr)?'':'disabled'}>Salva</button></div>
      </div>`;
    }

    const ab=!valoriOpen ? '' : `<div class="ab-head"><span>Abitudini</span><span class="ab-n">${fatte}/${tot}</span></div>
      <div class="ab-grid">${abitudini.map(a=>`<button class="ab${abFatta(a,k)?' on':''}" data-ab="${a.id}"><span class="bx">${I.check}</span><span class="nm">${esc(a.nome)}</span></button>`).join('')}</div>
      ${pesataOpen?`<div class="pw-add" style="margin-top:10px"><input id="abPeso" type="number" inputmode="decimal" step="0.1" placeholder="Peso di oggi" value="${pesataDraft}"><button id="abPesoOk">Salva</button></div>`:''}`;

    wrap.innerHTML=testa+form+ab;

    wrap.querySelectorAll('[data-gg]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); spostaGiorno(+b.dataset.gg); });
    wrap.querySelector('.ck-top').onclick=()=>{
      valoriOpen=!valoriOpen;
      if(valoriOpen) gDraft=Object.assign({sonnoOre:null, sonnoQ:0, energia:0, motivazione:0, doms:0}, giornate[k]||{});
      renderDailyCheck();
    };
    wrap.querySelectorAll('[data-ck]').forEach(b=> b.onclick=()=>{ gDraft[b.dataset.ck]=+b.dataset.n; renderDailyCheck(); });
    wrap.querySelectorAll('[data-ore]').forEach(b=> b.onclick=()=>{
      const d=+b.dataset.ore;
      gDraft.sonnoOre = gDraft.sonnoOre==null ? 7 : Math.max(0, Math.min(14, Math.round((gDraft.sonnoOre+d)*2)/2));
      renderDailyCheck();
    });
    const c=wrap.querySelector('#ckCancel'); if(c) c.onclick=()=>{ valoriOpen=false; renderDailyCheck(); };
    const sv=wrap.querySelector('#ckSave'); if(sv) sv.onclick=()=>salvaGiornata();
    wrap.querySelectorAll('[data-ab]').forEach(b=> b.onclick=()=>toggleAbitudine(b.dataset.ab));
    const pin=wrap.querySelector('#abPeso');
    if(pin){
      pin.addEventListener('input',e=>{ pesataDraft=e.target.value; });
      wrap.querySelector('#abPesoOk').onclick=()=>{
        const v=parseFloat(String(pesataDraft).replace(',','.'));
        if(!(v>0) || v>400) return;
        const kk=KSEL(), i=pesi.findIndex(p=>dayKey(p.ts)===kk);
        if(i>=0) pesi[i].v=v; else pesi.push({id:uid(), ts:tsDi(kk), v});
        pesataDraft=''; pesataOpen=false; saveState(); renderDailyCheck(); toastMsg('Peso registrato');
      };
    }
    return wrap;
  }
  function renderDailyCheck(){
    const scroll=view.scrollTop;
    view.innerHTML=`<div class="dhead"><button type="button" class="back" id="checkBack" aria-label="Torna ad Altro">${I.chevL}</button><h2>Check giornaliero</h2></div>`;
    view.appendChild(ckCard());
    document.getElementById('checkBack').onclick=()=>showTab('altro');
    view.scrollTop=scroll;
  }

  let gModalKey=null, gModalDraft=null;
  function apriGiorno(k){
    gModalKey=k; gModalDraft=Object.assign({sonnoOre:null, sonnoQ:0, energia:0, motivazione:0, doms:0}, giornate[k]||{});
    dipingiGiorno();
  }
  function chiudiGiorno(){ gModalKey=null; const m=document.getElementById('gModal'); if(m){ m.style.display='none'; m.innerHTML=''; } renderView(); }
  function dipingiGiorno(){
    const k=gModalKey, dr=gModalDraft, m=document.getElementById('gModal');
    const seg=(kk,max,val)=>{ let x=''; for(let n=1;n<=max;n++) x+=`<button class="${val===n?'on':''}" data-gk="${kk}" data-n="${n}">${n}</button>`; return x; };
    const d=new Date(k+'T12:00:00');
    m.innerHTML=`<div class="sg-back"></div><div class="sg-card">
      <div class="sg-t">${d.getDate()} ${MESI_L[d.getMonth()]} ${d.getFullYear()}</div>
      <div class="ck-form" style="border:0;padding-top:4px">
        <div class="ck-row"><div class="ck-lab"><span class="l">Ore di sonno</span><span class="v">${dr.sonnoOre==null?'—':dec1(dr.sonnoOre)+' h'}</span></div>
          <div class="ck-step"><button data-gore="-0.5">−</button><div class="val">${dr.sonnoOre==null?'—':dec1(dr.sonnoOre)}</div><button data-gore="0.5">+</button></div></div>
        <div class="ck-row"><div class="ck-lab"><span class="l">Qualità del sonno</span><span class="v">${dr.sonnoQ||'—'}/10</span></div>
          <div class="ck-seg dieci">${seg('sonnoQ',10,dr.sonnoQ)}</div></div>
        ${CK_VOCI.map(v=>`<div class="ck-row"><div class="ck-lab"><span class="l">${v.l}</span><span class="v">${dr[v.k]||'—'}/${v.max}</span></div>
          <div class="ck-seg">${seg(v.k,v.max,dr[v.k])}</div>${v.hint?`<div class="ck-hint">${v.hint}</div>`:''}</div>`).join('')}
        ${haValori(dr)?`<div class="ck-zone ${ckZona(dr)}"><span class="dot"></span><span>${CK_MSG[ckZona(dr)]}</span></div>`:''}
      </div>
      <div class="ab-head" style="border-top:0"><span>Abitudini</span><span class="ab-n">${abContate(k)}/${abitudini.length}</span></div>
      <div class="ab-grid">${abitudini.map(a=>`<button class="ab${abFatta(a,k)?' on':''}" data-gab="${a.id}"><span class="bx">${I.check}</span><span class="nm">${esc(a.nome)}</span></button>`).join('')}</div>
      <div class="sg-acts" style="margin-top:14px"><button class="ann" id="gClose">Chiudi</button><button class="inv" id="gSave" ${haValori(dr)?'':'disabled'}>Salva</button></div>
    </div>`;
    m.style.display='flex';
    m.querySelector('.sg-back').onclick=chiudiGiorno;
    m.querySelector('#gClose').onclick=chiudiGiorno;
    m.querySelectorAll('[data-gk]').forEach(b=> b.onclick=()=>{ gModalDraft[b.dataset.gk]=+b.dataset.n; dipingiGiorno(); });
    m.querySelectorAll('[data-gore]').forEach(b=> b.onclick=()=>{
      const dd=+b.dataset.gore;
      gModalDraft.sonnoOre = gModalDraft.sonnoOre==null ? 7 : Math.max(0, Math.min(14, Math.round((gModalDraft.sonnoOre+dd)*2)/2));
      dipingiGiorno();
    });
    m.querySelectorAll('[data-gab]').forEach(b=> b.onclick=()=>{
      const a=abitudini.find(x=>x.id===b.dataset.gab), g=giornata(k,true);
      g.h[a.id]=!abFatta(a,k); saveState(); dipingiGiorno();
    });
    m.querySelector('#gSave').onclick=()=>{
      const g=giornata(k,true);
      ['sonnoOre','sonnoQ','energia','motivazione','doms'].forEach(f=>{ g[f]=gModalDraft[f]; });
      g.zona=ckZona(g);
      if(k===OGGI_KEY()){
        diario=diario.filter(x=>!(x.tipo==='checkin' && x.meta && x.meta.giorno===k));
        pushDiario('checkin', `Sonno ${dec1(g.sonnoOre)}h · qualità ${g.sonnoQ}/10 · energia ${g.energia}/5 · DOMS ${g.doms}/5 · motivazione ${g.motivazione}/5<br><b>Zona ${g.zona}</b>`, {giorno:k});
      }
      saveStateNow(); chiudiGiorno(); toastMsg('Giornata salvata');
    };
  }

  function toggleAbitudine(id){
    const k=KSEL(), a=abitudini.find(x=>x.id===id); if(!a) return;
    if(a.auto==='peso' && !abFatta(a,k) && !pesataDel(k)){ pesataOpen=true; renderDailyCheck(); return; }
    const g=giornata(k,true);
    g.h[id]=!abFatta(a,k);
    saveState();
    renderDailyCheck();
  }

  function salvaGiornata(){
    const k=KSEL(), g=giornata(k,true);
    ['sonnoOre','sonnoQ','energia','motivazione','doms'].forEach(f=>{ g[f]=gDraft[f]; });
    g.zona=ckZona(g); g.ts=Date.now();
    // Il coach riceve i valori nel diario, senza notifica
    diario=diario.filter(x=>!(x.tipo==='checkin' && x.meta && x.meta.giorno===k));
    pushDiario('checkin', `<b>${etichettaGiorno(k)}</b> · Sonno ${dec1(g.sonnoOre)}h · qualità ${g.sonnoQ}/10 · energia ${g.energia}/5 · DOMS ${g.doms}/5 · motivazione ${g.motivazione}/5<br><b>Zona ${g.zona}</b>`, {giorno:k});
    valoriOpen=false; saveState(); renderDailyCheck(); renderNav();
  }
  function dec1(v){ return v==null ? '—' : String(Math.round(v*10)/10).replace('.',','); }

  // ====== ABITUDINI: andamento e personalizzazione ======
  let abMese = new Date().getMonth(), abAnno = new Date().getFullYear(), abModifica=false;
  const MESI_L=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  function giorniDelMese(y,m){
    const out=[], n=new Date(y,m+1,0).getDate(), oggi=OGGI_KEY();
    for(let d=1; d<=n; d++){ const k=dayKey(new Date(y,m,d).getTime()); if(k<=oggi) out.push(k); }
    return out;
  }
  function primaGiornata(){
    const ks=Object.keys(giornate).sort();
    return ks.length ? ks[0] : OGGI_KEY();
  }
  function giorniValidi(y,m){ const p=primaGiornata(); return giorniDelMese(y,m).filter(k=>k>=p); }
  function streakAb(a){
    let n=0, d=new Date();
    if(!abFatta(a, dayKey(d.getTime()))) d.setDate(d.getDate()-1);   // oggi può non essere ancora fatta
    for(;;){ const k=dayKey(d.getTime()); if(k<primaGiornata() || !abFatta(a,k)) break; n++; d.setDate(d.getDate()-1); }
    return n;
  }

  function renderAbitudini(){
    if(abModifica) return renderAbitudiniEdit();
    const gg=giorniValidi(abAnno,abMese), tuttiGG=giorniDelMese(abAnno,abMese);
    const conValori=gg.filter(k=>haValori(giornate[k]));
    const media=f=>{ const v=conValori.map(k=>giornate[k][f]).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
    const mediaAb = gg.length ? gg.reduce((a,k)=>a+abPerc(k),0)/gg.length : 0;
    const primoGiorno=(new Date(abAnno,abMese,1).getDay()+6)%7;   // settimana da lunedì
    const nGiorni=new Date(abAnno,abMese+1,0).getDate();
    let celle=''; for(let i=0;i<primoGiorno;i++) celle+='<div class="hm-c vuota"></div>';
    for(let d=1; d<=nGiorni; d++){
      const k=dayKey(new Date(abAnno,abMese,d).getTime());
      const attivo=tuttiGG.includes(k) && k>=primaGiornata();
      const p=attivo?abPerc(k):0;
      const st=attivo && p>0 ? `background:rgba(var(--accent-rgb),${(0.18+p*0.72).toFixed(2)})` : '';
      celle+=`<div class="hm-c${attivo?'':' vuota'}${p>=0.999?' pieno':''}" style="${st}" ${attivo?`data-giorno="${k}"`:''}><span>${d}</span></div>`;
    }
    const ranking=abitudini.map(a=>{
      const n=gg.filter(k=>abFatta(a,k)).length;
      return {a, n, p: gg.length ? n/gg.length : 0, s:streakAb(a)};
    }).sort((x,y)=>y.p-x.p);

    let html=`<div class="dhead"><div class="back" id="back">${I.chevL}</div><h2>Abitudini</h2></div>
      <div class="mesenav"><button id="mPrev">${I.chevL}</button><span>${MESI_L[abMese]} ${abAnno}</span><button id="mNext">${I.chevR}</button></div>
      <div class="kpis">
        <div class="kpi"><div class="v">${Math.round(mediaAb*100)}%</div><div class="l">costanza</div></div>
        <div class="kpi"><div class="v">${dec1(media('sonnoOre'))}</div><div class="l">ore di sonno</div></div>
        <div class="kpi"><div class="v">${dec1(media('sonnoQ'))}</div><div class="l">qualità sonno</div></div>
        <div class="kpi"><div class="v">${conValori.length}</div><div class="l">giorni compilati</div></div>
      </div>
      <div class="chartcard"><div class="cc-t">Costanza giorno per giorno</div>
        <div class="hm-dow">${['L','M','M','G','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div>
        <div class="hm">${celle}</div></div>`;

    html+=`<div class="chartcard"><div class="cc-t">Per abitudine</div>${ranking.map(r=>`
      <div class="rk"><div class="rk-top"><span class="rk-n">${esc(r.a.nome)}</span><span class="rk-v">${Math.round(r.p*100)}%</span></div>
      <div class="rk-bar"><i style="width:${Math.round(r.p*100)}%"></i></div>
      <div class="rk-s">${r.n} giorni su ${gg.length}${r.s>1?` · serie attuale ${r.s} giorni`:''}</div></div>`).join('')}</div>`;

    const serieSonno=conValori.map(k=>({x:+k.slice(8), v:giornate[k].sonnoOre})).filter(p=>p.v!=null);
    if(serieSonno.length>=2) html+=`<div class="chartcard"><div class="cc-t">Ore di sonno</div>${miniChart(serieSonno, nGiorni, 0, 12, 'var(--accent)')}</div>`;
    const tris=[['energia','Energia','var(--accent)'],['motivazione','Motivazione','#1F497D'],['doms','DOMS','#B9761A']];
    const disponibili=tris.filter(([f])=>conValori.filter(k=>giornate[k][f]!=null).length>=2);
    if(disponibili.length) html+=`<div class="chartcard"><div class="cc-t">Energia, motivazione e DOMS</div>
      ${miniChartMulti(disponibili.map(([f,l,c])=>({label:l, col:c, pts:conValori.map(k=>({x:+k.slice(8), v:giornate[k][f]})).filter(p=>p.v!=null)})), nGiorni, 0, 5)}
      <div class="lg">${disponibili.map(([,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div></div>`;

    const annoBars=[];
    for(let m=0;m<12;m++){ const g2=giorniValidi(abAnno,m); annoBars.push({m, p: g2.length ? g2.reduce((a,k)=>a+abPerc(k),0)/g2.length : 0}); }
    if(annoBars.some(b=>b.p>0)) html+=`<div class="chartcard"><div class="cc-t">Costanza mese per mese · ${abAnno}</div>
      <div class="yb">${annoBars.map(b=>`<div class="yb-c"><div class="yb-bar"><i style="height:${Math.round(b.p*100)}%"></i></div><span>${MESI_L[b.m][0]}</span></div>`).join('')}</div></div>`;

    html+=`<button class="btn-accent" id="abEdit" style="width:100%;padding:13px;border-radius:13px;margin-top:6px">Modifica abitudini</button>`;
    view.innerHTML=html;
    document.getElementById('back').onclick=()=>{ altroDetail=null; view.scrollTop=0; renderView(); };
    document.getElementById('mPrev').onclick=()=>{ abMese--; if(abMese<0){ abMese=11; abAnno--; } renderAbitudini(); };
    document.getElementById('mNext').onclick=()=>{ abMese++; if(abMese>11){ abMese=0; abAnno++; } renderAbitudini(); };
    document.getElementById('abEdit').onclick=()=>{ abModifica=true; renderAbitudini(); };
    view.querySelectorAll('[data-giorno]').forEach(c=> c.onclick=()=>apriGiorno(c.dataset.giorno));
  }

  function miniChart(pts, nx, min, max, col){
    const W=320,H=130,L=26,R=10,T=10,B=18, pw=W-L-R, ph=H-T-B;
    const X=x=>L+((x-1)/Math.max(1,nx-1))*pw, Y=v=>T+(1-(v-min)/(max-min))*ph;
    const p=pts.slice().sort((a,b)=>a.x-b.x).map(d=>({x:X(d.x), y:Y(d.v)}));
    let grid=''; [min,(min+max)/2,max].forEach(v=>{ const y=Y(v); grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--line-soft)"/><text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted2)" font-weight="700">${v}</text>`; });
    const dots=p.map(d=>`<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="2.4" fill="${col}"/>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}<path d="${smoothPath(p)}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
  }
  function miniChartMulti(series, nx, min, max){
    const W=320,H=130,L=26,R=10,T=10,B=18, pw=W-L-R, ph=H-T-B;
    const X=x=>L+((x-1)/Math.max(1,nx-1))*pw, Y=v=>T+(1-(v-min)/(max-min))*ph;
    let grid=''; [min,(min+max)/2,max].forEach(v=>{ const y=Y(v); grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--line-soft)"/><text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted2)" font-weight="700">${v}</text>`; });
    const linee=series.map(s=>{ const p=s.pts.slice().sort((a,b)=>a.x-b.x).map(d=>({x:X(d.x), y:Y(d.v)}));
      return `<path d="${smoothPath(p)}" fill="none" stroke="${s.col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${linee}</svg>`;
  }

  // ====== MOTORE PROGRESSIONE CARICHI (da "Teorie di progressione": suggerimenti per serie dallo storico) ======
  // Carichi possibili con i dischi della palestra (1,25 · 2,5 · 5 · 10 · 15 · 20 kg): ogni multiplo di 1,25 kg.
  const DISCO_MIN=1.25;
  function stepOf(ex){ return ex.step!=null ? ex.step : DISCO_MIN; }
  function fmtKgS(v){ return String(Math.round(v*100)/100).replace('.', ','); }
  function parseTarget(t){ const m=String(t).trim().match(/^(\d+)\s*[-/]\s*(\d+)(?!\d)/); if(m) return {lo:+m[1], hi:+m[2], fix:false}; const n=parseInt(t,10); return isNaN(n)?null:{lo:n, hi:n, fix:true}; }
  // Aumento: il carico fattibile più vicino a +5% (almeno un disco da 1,25 in più). Calo: −5% arrotondato in giù.
  function upKg(kg,st=DISCO_MIN){ if(!kg||kg<=0) return st; let r=Math.round(kg*1.05/st)*st; if(r<=kg+1e-9) r+=st; return +r.toFixed(2); }
  function downKg(kg,st=DISCO_MIN){ let r=Math.floor((kg*0.95+1e-9)/st)*st; if(r>=kg-1e-9) r-=st; return +Math.max(r,0).toFixed(2); }
  // TECNICA 1 del Metodo (M07): prima serie col carico della volta scorsa, nella seconda si aumenta;
  // se le ripetizioni si chiudono quello è il nuovo carico, e nelle sedute dopo sale una serie in più
  // (3ª, poi 4ª, poi anche la 1ª). Quando tutte le serie sono al carico nuovo si riparte: 2ª serie su.
  // Serie col carico nuovo lontana dal range (2+ reps sotto) → torna al carico di prima e cerca una rep in più (Tecnica 2).
  function tecnica1(seq){
    const out=tecnica1Base(seq);
    // Serie fatte più leggere della prima (carichi in calo per la fatica): non si salta al carico della prima.
    // Chiusa → un disco sopra il suo carico (fino a quello della prima); non chiusa → stesso carico.
    // In ogni caso nessuna serie sale più di un passo rispetto a quello che ha fatto la volta scorsa.
    const base=seq[0].kg;
    seq.forEach((r,k)=>{
      if(k===0) return;
      if(r.kg<base-1e-9){
        out[k]=r.reps>=r.t.lo
          ? {dir:'up',kg:Math.min(upKg(r.kg),base),why:`chiusa a ${fmtKgS(r.kg)} kg: sali di poco, verso il carico della prima serie`}
          : {dir:'keep',kg:r.kg,why:`${r.reps}/${r.t.lo} a ${fmtKgS(r.kg)} kg: stesso carico, chiudi le ripetizioni`};
      }
      const tetto=upKg(r.kg);
      if(out[k].kg>tetto+1e-9) out[k]={...out[k],dir:'up',kg:tetto};
    });
    return out;
  }
  function tecnica1Base(seq){
    const base=seq[0].kg, H=Math.max(...seq.map(r=>r.kg)), out=[];
    const chiusa=r=>r.reps>=r.t.lo, pesante=r=>r.kg>=H-1e-9;
    if(H<=base+1e-9){
      seq.forEach((r,k)=>{
        if(k===1||(seq.length===1&&chiusa(r))) out[k]={dir:'up',kg:upKg(base),why:`${seq.length===1?'serie chiusa':'2ª serie'}: aumenta il peso; se chiudi le ripetizioni è il tuo nuovo carico`};
        else out[k]={dir:'keep',kg:base,why:k===0?'carico della volta scorsa':'torna al carico della prima serie'};
      });
      return out;
    }
    const nuove=seq.map((r,k)=>k>0&&pesante(r));
    const tutteChiuse=seq.every((r,k)=>!nuove[k]||chiusa(r));
    const frontiera=tutteChiuse?seq.findIndex((r,k)=>k>0&&!nuove[k]):-1;
    const promuoviPrima=tutteChiuse&&frontiera===-1;
    seq.forEach((r,k)=>{
      if(k===0) out[k]=promuoviPrima?{dir:'up',kg:H,why:`tutte le serie chiuse a ${fmtKgS(H)} kg: ora anche la prima`}:{dir:'keep',kg:base,why:'carico della volta scorsa'};
      else if(nuove[k]){
        if(chiusa(r)) out[k]={dir:'keep',kg:H,why:`chiusa a ${fmtKgS(H)} kg: è il tuo nuovo carico`};
        else if(r.t.lo-r.reps>=2) out[k]={dir:'push',kg:base,why:`a ${fmtKgS(H)} kg troppo sotto (${r.reps}/${r.t.lo}): torna a ${fmtKgS(base)} kg e cerca una rep in più`};
        else out[k]={dir:'keep',kg:H,why:`${r.reps}/${r.t.lo} a ${fmtKgS(H)} kg: riprova a chiuderla`};
      }
      else if(k===frontiera) out[k]={dir:'up',kg:H,why:`serie precedenti chiuse a ${fmtKgS(H)} kg: aumenta anche questa`};
      else out[k]={dir:'keep',kg:base,why:'torna al carico della prima serie'};
    });
    return out;
  }
  function suggSets(ex){
    const previous=riferimento(ex);
    if(!previous) return null;
    const {sets:last,perSide}=previous;
    const st=stepOf(ex), uni=isUnilat(ex), n=nSlot(ex);
    const mode = ex.rm ? 'rm' : (ex.prog==='drop' ? 'drop' : (ex.prog==='interrotte' ? 'interrotte' : (ex.prog==='stripping' ? 'stripping' : (ex.repsSerie ? 'variabili' : 'range'))));
    const out={mode, head:'', sets:[]};
    const bySlot=new Map(last.filter(set=>Number.isInteger(set.slot)).map(set=>[set.slot,set]));
    const references=Array.from({length:n},(_,i)=>{
      // Le sedute recenti conservano la posizione anche se una serie è stata saltata.
      const index=uni&&!perSide&&last.length<=n/2?Math.floor(i/2):i;
      const set=bySlot.size?bySlot.get(i):last[index];
      const kg=valoreSerie(set?.kg), reps=valoreSerie(set?.reps);
      if(reps===null||reps<=0||kg===null||kg<0||kg===0&&!serieACorpoLibero(ex,i))return null;
      return {kg,reps};
    });
    if(!references.some(Boolean))return null;

    if(mode==='stripping'){ out.head='Stripping: stesso carico della serie precedente, a cedimento, poi −20% a ogni scarico.'; return out; }

    if(mode==='rm'){
      if(!references[0])return null;
      const {kg}=references[0];
      const best=Math.max(...references.filter(Boolean).map(s=>s.reps));
      const over=best>ex.rm;
      const nk=over?upKg(kg,st):kg;
      out.head = over
        ? 'Hai superato il '+ex.rm+'RM ('+best+' reps): questa settimana sali a <b>'+fmtKgS(nk)+' kg</b>, carico unico su tutte le serie.'
        : 'Resta su <b>'+fmtKgS(kg)+' kg</b> per tutte le serie: il '+ex.rm+'RM non è ancora superato (max '+best+' reps).';
      references.forEach((set,i)=>{if(set)out.sets[i]={dir:over?'up':'keep',kg:nk,lkg:set.kg,lreps:set.reps,why:over?'RM superato in una serie':'carico unico dal tuo '+ex.rm+'RM'};});
      return out;
    }

    if(mode==='interrotte'){
      if(!references[0])return null;
      const tgt=parseInt((String(ex.reps).match(/\d+/)||['5'])[0],10);
      const {kg}=references[0];
      const closed=references.every(s=>s&&s.reps>=tgt);
      const nk=closed?upKg(kg,st):kg;
      out.head=closed ? 'Hai chiuso anche l&rsquo;ultimo miniset: aumenta a <b>'+fmtKgS(nk)+' kg</b>.' : 'Ultimo miniset non chiuso: stesso carico anche questa settimana.';
      references.forEach((set,i)=>{if(set)out.sets[i]={dir:closed?'up':'keep',kg:nk,lkg:set.kg,lreps:set.reps,why:closed?'tutti i miniset chiusi':'ultimo miniset non chiuso'};});
      return out;
    }

    if(mode==='range'){
      // Ogni lato degli unilaterali segue la sua sequenza di serie.
      const lati=uni?[0,1]:[0], perSerie=uni?Math.ceil(n/2):n;
      let fatto=true;
      for(const lato of lati){
        const slots=Array.from({length:perSerie},(_,k)=>uni?2*k+lato:k).filter(i=>i<n);
        const seq=slots.map(i=>references[i]?{...references[i],t:parseTarget(ex.reps)}:null);
        if(seq.some(r=>!r)||!seq[0]?.t||!(seq[0].kg>0)){ fatto=false; break; }
        tecnica1(seq).forEach((sug,k)=>{ out.sets[slots[k]]={...sug,lkg:seq[k].kg,lreps:seq[k].reps}; });
      }
      if(fatto){ out.note='Metodo Lippolis: prima serie col carico della volta scorsa, nella seconda aumenti; quando chiudi le ripetizioni col carico nuovo, nelle sedute dopo sale anche la serie successiva.'; return out; }
      out.sets=[];
    }
    const dropTgt = mode==='drop' ? parseInt((String(ex.reps).match(/\d+/)||['8'])[0],10) : null;
    for(let i=0;i<n;i++){
      const set=references[i];
      if(!set)continue;
      const {kg,reps}=set;
      let s=null;
      if(mode==='drop'){
        if(i>0){ s={dir:'keep', kg:kg, why:'nel drop set si progredisce solo sul 1° blocco'}; }
        else {
          const diff=dropTgt-reps;
          if(diff<=0) s={dir:'up', kg:upKg(kg,st), why:'1° blocco chiuso ('+reps+'/'+dropTgt+')'};
          else if(diff<=2) s={dir:'keep', kg:kg, why:reps+'/'+dropTgt+' sul 1° blocco: stesso peso, punta alle reps'};
          else s={dir:'down', kg:downKg(kg,st), why:'1° blocco troppo lontano ('+reps+'/'+dropTgt+')'};
        }
      } else {
        const targetIndex=uni?Math.floor(i/2):i;
        const tRaw=ex.repsSerie?.[targetIndex]??ex.reps;
        const t=parseTarget(tRaw);
        if(!t){ s={dir:'keep', kg:kg, why:'&mdash;'}; }
        else if(t.fix){
          const diff=t.lo-reps;
          if(diff<=0) s={dir:'up', kg:upKg(kg,st), why:'hai chiuso '+reps+' reps su '+t.lo};
          else if(diff<=2) s={dir:'keep', kg:kg, why:reps+'/'+t.lo+' reps: stesso peso, punta alle reps'};
          else s={dir:'down', kg:downKg(kg,st), why:'troppe reps sotto il target ('+reps+'/'+t.lo+')'};
        } else {
          if(reps>t.hi){ s = kg>0 ? {dir:'up', kg:upKg(kg,st), why:'hai sforato il range ('+reps+'&gt;'+t.hi+')'} : {dir:'zav', kg:st, why:'range sforato a corpo libero: pronto per la zavorra'}; }
          else if(reps===t.hi){
            s = kg>0 ? {dir:'up', kg:upKg(kg,st), why:'tetto del range ('+reps+'/'+t.hi+'): rischi di sforare'} : {dir:'zav', kg:st, why:'tetto del range a corpo libero: pronto per la zavorra'};
          }
          else if(reps<t.lo){ s = kg>0 ? {dir:'down', kg:downKg(kg,st), why:'sotto il range ('+reps+'&lt;'+t.lo+')'} : {dir:'keep', kg:0, why:'a corpo libero: consolida le reps'}; }
          else if(reps===t.lo){ s={dir:'keep', kg:kg, why:'base del range ('+reps+'/'+t.lo+'-'+t.hi+'): stesso peso, punta ad almeno una in più'}; }
          else { s={dir:'keep', kg:kg, why:'dentro il range ('+reps+' su '+t.lo+'-'+t.hi+')'}; }
        }
      }
      out.sets[i]={...s,lkg:kg,lreps:reps};
    }
    if(mode==='drop') out.note='Drop set: si progredisce solo sul 1° blocco, gli altri tengono il peso della scorsa sessione.';
    if(mode==='variabili') out.note='Range variabili: ogni serie ha il suo range e il suo peso.';
    return out;
  }

  // Serie della volta precedente (stesso giorno, altrimenti l'ultima in assoluto): in grigio nei campi.
  function precedentiSerie(ex){
    const previous=riferimento(ex); if(!previous) return [];
    const {sets:last,perSide}=previous, uni=isUnilat(ex), n=nSlot(ex);
    const bySlot=new Map(last.filter(set=>Number.isInteger(set.slot)).map(set=>[set.slot,set]));
    return Array.from({length:Math.max(n,last.length*(uni&&!perSide?2:1))},(_,i)=>{
      const set=bySlot.size?bySlot.get(i):last[uni&&!perSide&&last.length<=n/2?Math.floor(i/2):i];
      if(!set||set.reps==null) return null;
      const kg=valoreSerie(set.kg);
      return {kg, kgTxt:set.kgTesto||(kg===null?'':kg===0?'C.L.':fmtKgIt(kg)), repsTxt:String(set.repsTesto||set.reps)};
    });
  }

    }else if(supportsProgression){
      suggHTML=`<div class="sugg"><div class="sugg-l">${I.spark} Progressione</div></div>`;
    }
    c.innerHTML=`
      <div class="card-top">

        ${historyButton}

    if(hasSets){ c.querySelectorAll('.set').forEach((row,s)=>{ const ins=row.querySelectorAll('input'); ins[0].value=st.sets[s].kg??''; ins[1].value=st.sets[s].reps??''; ins[2].value=st.sets[s].rir??''; paintRir(ex,row,st.sets[s].rir); ins[0].addEventListener('input',e=>{st.sets[s].kg=e.target.value.trim(); afterChange(ex,st,c);}); ins[1].addEventListener('input',e=>{st.sets[s].reps=e.target.value.trim(); afterChange(ex,st,c);}); ins[1].addEventListener('change',()=>{ /* reps scritte e peso lasciato vuoto: vale il peso della volta scorsa (quello in grigio) */ if(st.sets[s].reps&&!st.sets[s].kg&&prev[s]?.kgTxt&&!serieACorpoLibero(ex,s)){ ins[0].value=prev[s].kgTxt; st.sets[s].kg=prev[s].kgTxt; afterChange(ex,st,c);} }); ins[2].addEventListener('input',e=>{st.sets[s].rir=e.target.value.trim(); paintRir(ex,row,st.sets[s].rir); afterChange(ex,st,c);}); }); }
    const rb=c.querySelector('[data-rir-info]'); if(rb) rb.onclick=()=>{ const h=c.querySelector('.rir-hint'); if(h) h.hidden=!h.hidden; };
    const sq=c.querySelector('[data-sugg-info]'); if(sq) sq.onclick=(e)=>{ e.stopPropagation(); const h=c.querySelector('.sugg-hint'); if(h) h.hidden=!h.hidden; };
    if(sg){
      const fillKg=(i)=>{ const s=sg.sets[i]; if(!s || !(s.kg>0)) return false; const row=c.querySelectorAll('.set')[i]; if(!row) return false; row.querySelectorAll('input')[0].value=s.kg; st.sets[i].kg=String(s.kg); return true; };
      const markDone=(r)=>{ r.classList.add('done'); const a=r.querySelector('.sgadd'); if(a) a.innerHTML=`<span class="okd">${I.check}</span>`; };

      const sa=c.querySelector('.sugg-apply'); if(sa) sa.onclick=(e)=>{ e.stopPropagation(); c.querySelectorAll('.sgrow').forEach(r=>{ const i=+r.dataset.si; if(fillKg(i)) markDone(r); }); afterChange(ex,st,c); sa.textContent='✓ Inseriti'; };

    const delSet=c.querySelector('.del-set-btn'); if(delSet) delSet.onclick=(e)=>{ e.stopPropagation(); const count=uni?2:1, now=slotCount(ex,st); if(now<=count) return; st.sets.splice(now-count,count); st.nSet=now-count; const y=view.scrollTop; saveStateNow(); wkRefresh(); view.scrollTop=y; };
    return c;

  // ====== SEGNALAZIONE SU SINGOLO ESERCIZIO ======
  // Il motivo "dolore" non passa dalla coda normale: diventa escalation, come nel Q&A.
  const SG_MOTIVI=[
    {k:'dolore',    l:'Dolore durante il movimento', danger:true},
    {k:'fastidio',  l:'Fastidio articolare'},
    {k:'carico',    l:'Carico troppo alto o troppo basso'},
