  function openSegnala(nome, exSt){
    sgSel=null; sgNota=''; segnalaEx=nome;
    const m=document.getElementById('sgModal');
    const opts=SG_MOTIVI.map(o=>`<button class="sg-opt${o.danger?' danger':''}" data-sg="${o.k}"><span class="rd"></span>${o.l}</button>`).join('');
    m.innerHTML=`<div class="sg-back"></div>

        <div class="sg-t">Segnala un problema</div>
        <div class="sg-s">${nome}</div>
        <div class="sg-opts">${opts}</div>

        <textarea class="sg-ta" id="sgNota" placeholder="Aggiungi un dettaglio: quando succede, dove lo senti, a che serie…"></textarea>
        <div class="sg-acts"><button class="ann" id="sgAnn">Annulla</button><button class="inv" id="sgInv" disabled>Invia a Vittorio</button></div>
      </div>`;
    m.style.display='flex';
    const chiudi=()=>{ m.style.display='none'; m.innerHTML=''; segnalaEx=null; };
    m.querySelector('.sg-back').onclick=chiudi;
    document.getElementById('sgAnn').onclick=chiudi;
    const inv=document.getElementById('sgInv');
    m.querySelectorAll('[data-sg]').forEach(b=> b.onclick=()=>{
      sgSel=b.dataset.sg;
      m.querySelectorAll('[data-sg]').forEach(x=>x.classList.toggle('on', x.dataset.sg===sgSel));
      const w=document.getElementById('sgWarn');
      w.innerHTML = sgSel==='dolore'
        ? `<div class="sg-warn">${I.alertTri}<span>Se senti dolore, <b>interrompi l'esercizio adesso</b>. Questa segnalazione parte come notifica urgente: Vittorio ti contatta entro 24 ore. Non sostituire l'esercizio da solo.</span></div>`
        : '';
      inv.disabled=false;
    });
    document.getElementById('sgNota').addEventListener('input',e=>{ sgNota=e.target.value; });
    inv.onclick=()=>{
      if(!sgSel) return;
      const mot=SG_MOTIVI.find(o=>o.k===sgSel);
      const dett=sgNota.trim() ? '<br><span style="opacity:.85">«'+sgNota.trim().replace(/</g,'&lt;')+'»</span>' : '';
      const corpo=`<b>${nome}</b><br>${mot.l}${dett}`;
      if(sgSel==='dolore') pushToCoach('urgenza', corpo, {categoria:'dolore', origine:'esercizio'});

      if(workoutView==='detail') wkRefresh();

  async function openExec(ex){
    const m=document.getElementById('execModal');
    m.innerHTML=`<div class="em-backdrop"></div><div class="em-card" role="dialog" aria-modal="true" aria-labelledby="executionTitle"><div class="em-head"><div class="em-title" id="executionTitle">${esc(ex.nome)}</div><button type="button" class="em-close" aria-label="Chiudi">${I.close}</button></div><div class="em-cap"><div class="em-notes"></div><div class="em-link" role="status"></div></div></div>`;

    const notes=m.querySelector('.em-notes'), link=m.querySelector('.em-link');

    try{
      const {parseExerciseVideo}=await import('./src/exercise-video.mjs');

      player.src=media.embedUrl||media.url;

      const external=document.createElement('a'); external.href=media.url; external.target='_blank'; external.rel='noopener noreferrer'; external.textContent='Apri video in una nuova scheda';
      link.replaceChildren(external);
    }catch{ if(link.isConnected)link.textContent='Video non disponibile. Chiedi al PT di controllare il link.'; }
  }

  // ====== STORICO PESI (pagina completa) ======
  function fmtDataAnno(ts){ const d=new Date(ts); const m=MESI[d.getMonth()]; return m ? d.getDate()+' '+m.charAt(0).toUpperCase()+m.slice(1)+' '+d.getFullYear() : 'Data non disponibile'; }
  function getStorico(name, exerciseId){
    const normalized=String(name||'').trim().toLocaleLowerCase('it');
    return sessioni.slice().sort((a,b)=>b.ts-a.ts)
      .map(se=>{ const choices=(se.esercizi||[]).filter(e=>e.sets?.length); return {se,ex:(exerciseId&&choices.find(e=>e.exerciseId===exerciseId))||choices.find(e=>String(e.nome||'').trim().toLocaleLowerCase('it')===normalized)}; })
      .filter(x=>x.ex)
      .map(x=>({ data: fmtDataAnno(x.se.ts), sett: x.se.settimana, nota: x.ex.note||'', lati: (x.ex.lati && x.ex.lati.length===x.ex.sets.length) ? x.ex.lati : ((x.ex.uni || /per lato/i.test(x.ex.note||'')) && x.ex.sets.length%2===0 ? x.ex.sets.map((_,i)=>LATI[i%2]) : null), serie: x.ex.sets }));
  }
  // Riferimento per giornata: lo stesso esercizio in due sedute diverse (es. Peck back il giorno dorso
  // e il giorno spalle) ha carichi diversi, e il confronto va fatto con la stessa seduta.
  let ultimiPerGiorno = {};
  function riferimento(ex){
    const g=giorni[giornoCorr];
    const candidates=[g&&ultimiPerGiorno[g.titolo+'|'+ex.nome],ultimiPesi[ex.nome]];
    return candidates.find(record=>record&&record.unit!=='sec'&&(record.perLato==null||record.perLato===!!ex.perLato));
  }
  function ricalcolaUltimi(){
    ultimiPesi={}; ultimiPerGiorno={};
    sessioni.slice().sort((a,b)=>a.ts-b.ts).forEach(se=> se.esercizi.forEach(e=>{
      const sets=(e.sets||[]).filter(st=>st.reps!=null);
      if(sets.length){
        const record={sets,perSide:!!(e.uni||e.lati?.length),unit:e.unita,perLato:e.perLato};
        ultimiPesi[e.nome]=record;
        ultimiPerGiorno[se.titolo+'|'+e.nome]=record;
      }
    }));
  }

  // Chiude la sessione: archivia serie, note e segnalazioni, aggiorna i carichi di riferimento
  // e passa all'allenamento successivo della sequenza.
  function datiSessione(day){
    const g=giorni[day], out=[];
    g.esercizi.forEach((ex,idx)=>{
      const st=(stato[day]||{})[idx]; if(!st) return;
      const rows=(st.sets||[]).map((set,i)=>({value:leggiSerie(ex,set,i),i})).filter(r=>r.value);
      if(rows.length || st.manual || st.note || st.segnalato){
        const o={nome:ex.nome, exerciseId:ex.id||null, sets:rows.map(r=>({...r.value,slot:r.i})), fatto:isDone(ex,st), note:st.note||'', segnalato:st.segnalato||null, unita:ex.unita||null, perLato:!!ex.perLato};
        if(isUnilat(ex)){ o.uni=true; o.lati=rows.map(r=>LATI[r.i%2]); }
        out.push(o);

    return out;
  }
  function concludiSessione(day){
    if(giornoFatto(day)){ toastMsg('Allenamento già registrato'); return false; }
    const g=giorni[day];
    for(const [idx,ex] of g.esercizi.entries()){
      const invalid=(stato[day]?.[idx]?.sets||[]).findIndex((s,i)=>[s.kg,s.reps,s.rir].some(v=>v!=null&&v!=='')&&!leggiSerie(ex,s,i));
      if(invalid>=0){ toastMsg(ex.nome+': controlla i dati della serie '+slotLabel(ex,invalid)); return false; }
    }
    const es=datiSessione(day);
    if(!es.some(ex=>ex.sets.length || ex.fatto)){ toastMsg('Registra una serie o segna un esercizio come completato'); return false; }
    const tot=g.esercizi.length, fatti=countDone(day);
    if(fatti<tot && !confirm('Hai completato '+fatti+' esercizi su '+tot+'. Concludere comunque l\'allenamento?')) return false;
    const k=chiaveNota(day), nota=(noteSessione[k]||'').trim();
    sessioni.push({id:uid(), ts:Date.now(), prog:PROGRAMMA.nome, programVersionId:versioneSchedaLocale||null, settimana:PROGRAMMA.settimane[settCorr].n, giorno:day, dt:g.dt, titolo:g.titolo, nota, esercizi:es});
    if(nota) pushDiario('feedback', `<b>${g.titolo}</b><br>${nota.replace(/</g,'&lt;')}`);
    noteSessione[k]='';
    ricalcolaUltimi();
    delete stato[day];
    saveStateNow();
    backFromWorkout();

  }
  function coachNoteHTML(ex){

  function fmtSerie(e, st){

      html+=sessioni.slice().sort((a,b)=>b.ts-a.ts).map(se=>{

    view.querySelectorAll('[data-sv]').forEach(b=> b.onclick=()=>{ storicoVista=b.dataset.sv; renderStoricoPesi(); });
    view.querySelectorAll('.ex-hist-row').forEach((r,i)=> r.onclick=()=>{ altroStoricoEx=names[i]; view.scrollTop=0; renderStoricoPesi(); });
  }

  // ====== TIMER (recupero / esercizio a tempo) ======
  function toSec(t){ const p=String(t).split(':').map(Number); return p.length===2 ? p[0]*60+p[1] : (p[0]||0); }
  function fmtT(s){ const m=Math.floor(s/60), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
  function ensureAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
  async function requestWake(){ try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){} }
  function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
  // keep-alive silenzioso per mantenere vivo l'audio in background (best effort)
  function keepAliveStart(){ try{ ensureAudio(); if(!audioCtx) return; const buf=audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate); const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true; const g=audioCtx.createGain(); g.gain.value=0.0001; src.connect(g); g.connect(audioCtx.destination); src.start(); tmr.keepAlive=src; }catch(e){} }
  function keepAliveStop(){ try{ if(tmr.keepAlive){ tmr.keepAlive.stop(); tmr.keepAlive.disconnect(); tmr.keepAlive=null; } }catch(e){} }
  // --- Ponte nativo (solo APK): plugin TimerRecupero. In browser/PWA è assente e resta l'audio web.
  // Contratto: avvia({fine, durata, titolo, testo}) → notifica fissa con conto alla rovescia + bolla sopra
  // le altre app + allarme allo scadere (anche in background), risolve {bolla:true|false};
  // ferma() → toglie tutto; permessoBolla() → apre l'impostazione "Mostra sopra altre app";
  // evento 'fermato' → l'utente ha chiuso il timer dalla notifica o dalla bolla.
  function timerNativo(){ try{ const C=window.Capacitor; if(C && C.isPluginAvailable && C.isPluginAvailable('TimerRecupero')) return C.Plugins.TimerRecupero; }catch(e){} return null; }
  const BOLLA_KEY='lippolis_pt_bolla_chiesta';
  function nativoAvvia(){
    const T=timerNativo(); if(!T) return false;
    try{
      const cs=getComputedStyle(document.documentElement), col=v=>(cs.getPropertyValue(v)||'').trim();
      const p=T.avvia({fine:tmr.endAt, durata:tmr.total*1000, titolo:tmr.label||'Recupero', testo:'Tocca per tornare all\u2019allenamento', colore:col('--accent')||'#12C7A2', coloreTesto:col('--accent-btn')||'#04231B', volume:volTimer/100, preavviso:PREAVVISO*1000});
      if(p && p.then) p.then(r=>{ if(r && r.bolla===false && !localStorage.getItem(BOLLA_KEY)){ localStorage.setItem(BOLLA_KEY,'1'); if(confirm('Per vedere il timer sopra le altre app serve un permesso di Android ("Mostra sopra altre app"). Aprire l\u2019impostazione?')) T.permessoBolla(); } }).catch(()=>{});
      return true;
    }catch(e){ return false; }
  }
  function nativoFerma(){ const T=timerNativo(); if(!T) return; try{ const p=T.ferma(); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
  (function ascoltaNativo(){ const T=timerNativo(); if(T && T.addListener){ try{ T.addListener('fermato', ()=>{ if(tmr.running||tmr.finished){ tmr.nativo=false; stopTimer(); } }); }catch(e){} } })();

  function cancelScheduledBeep(){ (tmr.nodes||[]).forEach(o=>{ try{ o.stop(); }catch(e){} try{ o.disconnect(); }catch(e){} }); tmr.nodes=[]; }
  // Allarme: preavviso a −3, −2, −1 secondi (tre rintocchi brevi) e, allo scadere, un arpeggio
  // a campana ripetuto due volte. Il suono è sintetizzato qui e, identico campione per campione,
  // generato in WAV per il plugin nativo (stessa ricetta in genera_suono.py).
  // Il volume è quello del cursore in Profilo, con curva quadratica (più naturale all'orecchio).
  const PREAVVISO=3;
  const SUONO={
    parziali:[[1,1,1],[2,0.35,0.6],[3,0.12,0.4],[4.16,0.06,0.25]],   // [rapporto, ampiezza, frazione di decadimento]
    note:[
      [0.00, 880,   0.55, 0.12], [1.00, 880,   0.55, 0.12], [2.00, 880,   0.55, 0.12],
      [3.00, 1046.5,0.50, 0.45], [3.08, 1318.5,0.50, 0.45], [3.16, 1568,  0.50, 0.45],
      [4.10, 1046.5,0.50, 0.45], [4.18, 1318.5,0.50, 0.45], [4.26, 1568,  0.50, 0.45]
    ],                                                                 // [inizio s, frequenza Hz, ampiezza, tau s]
    durata:5.6, attacco:0.004, picco:0.95
  };
  function sintetizzaAllarme(sr){
    const N=Math.round(SUONO.durata*sr), buf=new Float32Array(N), att=SUONO.attacco;
    SUONO.note.forEach(([t0,f,amp,tau])=>{
      const n0=Math.round(t0*sr), len=Math.min(N-n0, Math.round(tau*8*sr));
      for(let i=0;i<len;i++){
        const t=i/sr, env=(t<att? t/att : 1);

        buf[n0+i]+=amp*env*v;
      }
    });
    let pk=0; for(let i=0;i<N;i++){ const x=Math.abs(buf[i]); if(x>pk) pk=x; }
    const k=pk>0?SUONO.picco/pk:1; for(let i=0;i<N;i++) buf[i]*=k;

  }
  let volTimer=70;   // 10-100, dal cursore in Profilo

  // suona la sequenza in modo che l'arpeggio cada fra inSec secondi; se mancano meno di 3" salta i rintocchi già passati
  function suonaSequenza(inSec, lista){ try{ ensureAudio(); if(!audioCtx) return; const src=audioCtx.createBufferSource(), g=audioCtx.createGain(); src.buffer=bufferAllarme(); g.gain.value=guadagnoVol(); src.connect(g); g.connect(audioCtx.destination);

  // Timer dell'esercizio a tempo: 5" per mettersi in posizione, poi il tempo della serie;
  // alla fine scrive i secondi nella serie e fa partire il recupero. Fermato prima, scrive i secondi fatti.
  const PREPARA=5;
  function secondiTarget(v){ const t=String(v||'').trim(); if(/^\d+:\d{1,2}$/.test(t)) return toSec(t); const n=(t.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.'))); if(!n.length) return 0; const m=Math.max(...n); return Math.round(/min/i.test(t)?m*60:m); }
  function scriviSecondi(input,sec){ if(!input||!(sec>0)) return; input.value=String(sec); input.dispatchEvent(new Event('input',{bubbles:true})); }

      const lav=tmr; tmr.poi=()=>{ scriviSecondi(input,Math.round(lav.target||sec)); if(rest>0){ startTimer(rest,'Recupero · '+label); return true; } return false; }; return true; };

  function startTimer(sec,label){ if(!sec||sec<=0) return; ensureAudio(); clearInterval(tmr.iv); cancelScheduledBeep(); keepAliveStop(); tmr={sec:sec, total:sec, target:sec, label:label||'Timer', running:false, finished:false, iv:null, endAt:0, nodes:[], keepAlive:null, nativo:false}; avviaCorsa(); updateTimerBar(); }

  function subTime(n){ if(tmr.finished||!(tmr.sec>0)) return; const tolti=Math.min(n,tmr.sec); tmr.sec-=tolti; tmr.target=Math.max(0,(tmr.target||0)-tolti);

  // riallinea e riprende l'audio quando si torna nell'app dopo essere stati in background
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) return; if(tmr.running){ ensureAudio(); const rem=Math.max(0, Math.ceil((tmr.endAt-Date.now())/1000)); tmr.sec=rem; if(rem<=0){ finishTimer(); } else { requestWake(); updateTimerBar(); } } });
  function updateTimerBar(){
    const bar=document.getElementById('timerBar'); if(!bar) return;
    bar.style.display='block';
    bar.classList.toggle('done', !!tmr.finished);
    bar.classList.toggle('work', tmr.fase==='lavoro');
    bar.classList.toggle('prep', tmr.fase==='prepara');
    bar.classList.toggle('last3', !!tmr.running && tmr.sec>0 && tmr.sec<=PREAVVISO);
    const pct = tmr.total ? Math.max(0, Math.min(100, tmr.sec/tmr.total*100)) : 0;
    bar.innerHTML=`
      <div class="tb-main">
        <div class="tb-info"><div class="tb-label">${tmr.finished?'Tempo scaduto':tmr.label}</div><div class="tb-time">${fmtT(tmr.sec)}${tmr.finished?' · fine!':''}</div></div>
        <div class="tb-ctrls">
          ${tmr.finished?'':`<button class="tb-b" id="tbMinus" aria-label="Togli 15 secondi">−15s</button><button class="tb-b" id="tbPlus" aria-label="Aggiungi 15 secondi">+15s</button>`}
          ${tmr.finished?'':`<button class="tb-b" id="tbToggle">${tmr.running?I.pause:I.play}</button>`}
          <button class="tb-b stop" id="tbStop">${I.close}</button>
        </div>
      </div>
      <div class="tb-track"><div class="tb-fill" style="width:${pct}%"></div></div>`;
    const p=bar.querySelector('#tbPlus'); if(p) p.onclick=()=>addTime(15);
    const m=bar.querySelector('#tbMinus'); if(m) m.onclick=()=>subTime(15);
    const tg=bar.querySelector('#tbToggle'); if(tg) tg.onclick=toggleTimer;
    bar.querySelector('#tbStop').onclick=stopTimer;
  }

  // ====== CONSIGLI ALIMENTARI ======
  // ====== PDF ======
  // Scheda e consigli alimentari esportabili in PDF (A4): nel telefono si condividono/salvano, nel browser si scaricano.
  function pdfButton(kind,label){ return `<button type="button" class="pdf-btn" data-pdf="${kind}">${I.download}<span>${label}</span></button><p class="pdf-status" role="status"></p>`; }
  function bindPdfButton(){
    view.querySelectorAll('[data-pdf]').forEach(btn=>btn.onclick=async()=>{
      const status=btn.nextElementSibling, label=btn.querySelector('span'), testo=label.textContent;
      btn.disabled=true; label.textContent='Preparo il PDF…'; if(status)status.textContent='';
      try{
        const pdf=await import('./src/pdf-export.mjs');
        const cliente=[profilo.nome,profilo.cognome].filter(Boolean).join(' ');
        const doc=await pdf.newPdf();
        let nome;
        if(btn.dataset.pdf==='workout'){
          const model=pdf.workoutPdfModel(PROGRAMMA,{cliente,isUnilat,fmtRec:ex=>{ if(ex.cardio||ex.timed) return ex.rec?fmtT(toSec(ex.rec)):'-'; const r=recEff(ex); return r?fmtT(r):'-'; }});
          pdf.drawWorkoutPdf(doc,model); nome=pdf.pdfFileName('Scheda',model.titolo);
        }else{
          const model=pdf.nutritionPdfModel(coachSections.nutrition?.plan,{cliente});
          pdf.drawNutritionPdf(doc,model); nome=pdf.pdfFileName('Consigli alimentari',model.titolo);
        }
        const how=await pdf.deliverPdf(doc,nome);
        if(status?.isConnected)status.textContent=how==='saved'?`Scaricato: ${nome}`:'';
      }catch(e){
        if(status?.isConnected&&!/cancel|annull|abort/i.test(String(e?.message||e)))status.textContent=e?.message||'Esportazione non riuscita. Riprova.';
      }finally{ btn.disabled=false; label.textContent=testo; }
    });
  }
  // Giorni del piano a fisarmonica (come CoachPlus): tutti i giorni in elenco, ognuno con le sue calorie;
  // aperto mostra torta dei macro, pasti e quantità. Gli altri giorni restano sempre raggiungibili.
  let consigliAperti=new Set();
  function macroGiorno(day){
    const n=v=>{ const x=Number(String(v??'').replace(',','.')); return Number.isFinite(x)&&x>0?x:0; };
    const p=n(day.proteine), c=n(day.carboidrati), f=n(day.grassi);
    const kcal=n(day.energia)||Math.round(p*4+c*4+f*9);
    return {kcal,p,c,f};
  }
  function tortaMacro({p,c,f}){
    const tot=p*4+c*4+f*9; if(!(tot>0)) return '';
    const a=c*4/tot*360, b=a+p*4/tot*360;
    return `<div class="nd-pie" role="img" aria-label="Ripartizione dei macronutrienti" style="background:conic-gradient(var(--m-carb) 0 ${a.toFixed(1)}deg,var(--m-prot) 0 ${b.toFixed(1)}deg,var(--m-fat) 0 360deg)"></div>`;
  }
  function renderConsigli(){
    const assigned=coachSections.nutrition?.plan;
    if(assigned){
      const qty=g=>g!==''&&g!=null?`<span class="nd-q"><b>${esc(g)}</b> g</span>`:'';
      const dish=item=>`<div class="nd-item"><span class="nd-n">${esc(item.nome)}</span>${qty(item.g)}</div>${item.alternative?.length?`<div class="nd-alt"><span class="nd-alt-l">Oppure</span>${item.alternative.map(a=>`<div class="nd-item"><span class="nd-n">${esc(a.nome)}</span>${qty(a.g)}</div>`).join('')}</div>`:''}`;
      const giorni=assigned.giorni||[];
      const days=giorni.map((day,i)=>{
        const m=macroGiorno(day), open=consigliAperti.has(i);
        const macros=[[m.c,'Carb.','carb'],[m.p,'Proteine','prot'],[m.f,'Grassi','fat']].filter(([v])=>v>0);
        return `<section class="nd-day${open?' open':''}">
          <button type="button" class="nd-head" data-nd-day="${i}" aria-expanded="${open}">
            <span class="nd-kcal"><small>Calorie</small><b>${m.kcal||'—'}</b></span>
            <span class="nd-name">${esc(day.nome||'Giorno '+(i+1))}</span>
            <span class="nd-chev">${I.chevR}</span>
          </button>
          ${open?`<div class="nd-body">
            ${m.kcal||macros.length?`<div class="nd-sum"><div class="nd-big"><small>Calorie</small><b>${m.kcal||'—'}</b></div>${tortaMacro(m)}${macros.length?`<div class="nd-macros">${macros.map(([v,l,k])=>`<div><b class="m-${k}">${Math.round(v)}g</b> ${l}</div>`).join('')}</div>`:''}</div>`:''}
            ${day.note?`<p class="nutrition-notes">${esc(day.note)}</p>`:''}
            ${(day.pasti||[]).map(meal=>`<div class="nd-meal"><h4>${esc(meal.tipo)}</h4>${(meal.items||[]).map(dish).join('')}</div>`).join('')||'<p class="nutrition-notes">Nessun pasto in questo giorno.</p>'}
          </div>`:''}
        </section>`;
      }).join('');
      view.innerHTML=`<div class="pagetitle">Consigli alimentari</div><div class="nd-plan">${esc(assigned.nome||'Piano alimentare')}</div>${assigned.descrizione?`<p class="nutrition-notes">${esc(assigned.descrizione)}</p>`:''}${days||'<div class="nodata">Il piano non contiene giorni.</div>'}${giorni.length?pdfButton('nutrition','Scarica i consigli in PDF'):''}`;
      bindPdfButton();
      view.querySelectorAll('[data-nd-day]').forEach(btn=>btn.onclick=()=>{
        const i=+btn.dataset.ndDay, y=view.scrollTop;
        if(consigliAperti.has(i)) consigliAperti.delete(i); else consigliAperti.add(i);
        renderConsigli(); view.scrollTop=y;
      });
      return;
    }
    const {plan,state}=nutrition;
    view.innerHTML=`<div class="pagetitle">Consigli alimentari</div>${plan?`<section class="physical-panel"><h2 class="physical-title">${esc(plan.title)}</h2>${plan.notes?`<p class="nutrition-notes">${esc(plan.notes)}</p>`:''}${(plan.meals||[]).map(meal=>`<div class="nutrition-meal"><b>${esc(meal.label)}</b><p>${esc(meal.text)}</p></div>`).join('')}</section>`:`<div class="empty"><div class="ic">${I.apple}</div><h2>${state==='loading'?'Caricamento…':state==='error'?'Consigli non disponibili':'Nessun consiglio pubblicato'}</h2><p>${state==='error'?'Controlla la connessione e riapri l’app per riprovare.':state==='loading'?'Sto cercando le indicazioni del tuo PT.':'Quando il tuo PT pubblicherà le indicazioni, le troverai qui.'}</p></div>`}`;
  }

  // ====== DOCUMENTI (file condivisi dal coach) ======
  const documenti = [];
  let docAperto=null;

    if(docAperto!=null){
      const d=documenti[docAperto];

  // ====== PROGRESSI ======
  // Un caricamento = fino a tre pose (Fronte, Lato, Retro) scelte insieme e condivise con un solo tasto.
  const POSE=[['fronte','Fronte'],['lato','Lato'],['retro','Retro']];
  let progressPhotoOwner='', progressDraft=null, progressSaving=false;
  let updateSharedProgressPhotos;
  const progressPhotoDate=new Intl.DateTimeFormat('it-IT',{dateStyle:'medium'});
  function clearProgressDraft(){
    for(const slot of Object.values(progressDraft?.slots||{}))if(slot?.url)URL.revokeObjectURL(slot.url);
    progressDraft=null;
  }
  function draftNuovo(){ if(!progressDraft)progressDraft={batch:crypto.randomUUID(),slots:{},preparing:0}; return progressDraft; }
  function apriFotoGrande(url,label){
    document.getElementById('photoViewer')?.remove();
    const box=document.createElement('div');
    box.id='photoViewer'; box.className='photo-viewer'; box.setAttribute('role','dialog'); box.setAttribute('aria-label',label||'Foto');
    box.innerHTML=`<button type="button" class="pv-close" aria-label="Chiudi">${I.close}</button><img alt="">${label?`<div class="pv-cap"></div>`:''}`;
    box.querySelector('img').src=url; box.querySelector('img').alt=label||'Foto di progresso';
    if(label)box.querySelector('.pv-cap').textContent=label;
    box.onclick=e=>{ if(e.target===box||e.target.closest('.pv-close'))box.remove(); };
    document.body.append(box);
  }
  function renderProgressi(){
    coachSectionPage('Progressi fisici',`
      <section class="physical-panel">
        <h3 class="physical-title">Aggiungi progresso fisico</h3>
        <p class="progress-copy">Tocca una posa per scattare o scegliere la foto, oppure prendile tutte e 3 insieme dalla galleria.</p>
        <div class="pose-slots" id="poseSlots"></div>
        <div class="progress-actions">
          <button type="button" class="bk-b" id="progressGallery">Scegli dalla galleria (anche tutte e 3)</button>
        </div>
        <input type="file" id="progressFile" accept="image/*,.heic,.heif" multiple hidden>
        <input type="file" id="progressPose" accept="image/*,.heic,.heif" hidden>
        <div class="progress-actions" id="progressSend" hidden>
          <button type="button" class="btn-accent" id="progressSave"></button>
          <button type="button" class="bk-b" id="progressCancel">Annulla</button>
        </div>
        <p class="progress-copy" id="progressFeedback" role="status"></p>
      </section>
      <section class="physical-panel">
        <h3 class="physical-title">Le tue foto</h3>
        <div id="athleteProgressPhotos"><p class="progress-copy">Caricamento foto…</p></div>
      </section>
      <section class="physical-panel" id="coachProgressPhotos" hidden>
        <h3 class="physical-title">Foto aggiunte dal PT</h3>
        <div class="progress-grid"></div>
      </section>`);
    const owner=progressPhotoOwner;
    const gallery=document.getElementById('progressGallery'), slotsHost=document.getElementById('poseSlots');
    const file=document.getElementById('progressFile'), poseInput=document.getElementById('progressPose');
    const send=document.getElementById('progressSend'), save=document.getElementById('progressSave'), cancel=document.getElementById('progressCancel');
    const feedback=document.getElementById('progressFeedback');
    const own=document.getElementById('athleteProgressPhotos');
    const shared=document.getElementById('coachProgressPhotos');
    const photosModule=()=>import('./src/progress-photos.mjs');
    const signed=async path=>{
      const [{getCoachFile},{PHOTO_BUCKET}]=await Promise.all([import('./src/athlete-coach-sections.mjs'),photosModule()]);
      return getCoachFile(PHOTO_BUCKET,path);
    };
    let posaScelta='fronte';
    function paintDraft(){
      const slots=progressDraft?.slots||{}, busy=!owner||progressSaving||progressDraft?.preparing>0;
      slotsHost.innerHTML=POSE.map(([key,label])=>{
        const slot=slots[key];
        return `<div class="pose-slot${slot?' filled':''}"><button type="button" class="pose-pick" data-pose="${key}" ${busy?'disabled':''} aria-label="${slot?'Cambia':'Aggiungi'} foto ${label}">${slot?'<img alt="">':`<span class="pose-plus">${I.camsmall}</span>`}</button><span class="pose-l">${label}</span>${slot&&!progressSaving?`<button type="button" class="pose-x" data-pose-x="${key}" aria-label="Togli foto ${label}">${I.close}</button>`:''}</div>`;
      }).join('');
      slotsHost.querySelectorAll('.pose-slot.filled img').forEach((img,i)=>{ const key=POSE.filter(([k])=>slots[k])[i][0]; img.src=slots[key].url; img.alt='Anteprima '+key; });
      slotsHost.querySelectorAll('[data-pose]').forEach(btn=>btn.onclick=()=>{
        posaScelta=btn.dataset.pose;
        // Sul telefono il selettore singolo propone sia la fotocamera sia la galleria.
        poseInput.click();
      });
      slotsHost.querySelectorAll('[data-pose-x]').forEach(btn=>btn.onclick=()=>{
        const slot=progressDraft?.slots[btn.dataset.poseX]; if(slot?.url)URL.revokeObjectURL(slot.url);
        if(progressDraft)delete progressDraft.slots[btn.dataset.poseX];
        if(progressDraft&&!Object.keys(progressDraft.slots).length)clearProgressDraft();
        paintDraft();
      });
      const n=Object.keys(slots).length;
      gallery.disabled=busy;
      send.hidden=!n;
      save.textContent=n===1?'Condividi 1 foto con il PT':`Condividi ${n} foto con il PT`;
      save.disabled=cancel.disabled=busy;
    }
    async function preparaInPosa(selected,key,current){
      current.preparing++;
      try{
        const {prepareProgressPhoto}=await photosModule();
        const blob=await prepareProgressPhoto(selected);
        if(progressDraft!==current)return;
        const old=current.slots[key]; if(old?.url)URL.revokeObjectURL(old.url);
        current.slots[key]={blob,url:URL.createObjectURL(blob)};
      }finally{ current.preparing--; }
    }
    async function selectPhotos(input,targetPose){
      const files=[...(input.files||[])];
      input.value='';
      if(!files.length||progressSaving)return;
      const current=draftNuovo();
      // Con la selezione multipla le foto riempiono le pose libere in ordine: Fronte, Lato, Retro.
      const free=POSE.map(([k])=>k).filter(k=>!current.slots[k]);
      const order=targetPose?[targetPose]:(free.length?free:POSE.map(([k])=>k));
      const picks=files.slice(0,order.length).map((f,i)=>[f,order[i]]);
      feedback.textContent=files.length>order.length?`Prese le prime ${order.length} foto: le pose sono 3.`:'Preparazione foto…';
      paintDraft();
      const results=await Promise.allSettled(picks.map(([f,key])=>preparaInPosa(f,key,current)));
      const failed=results.find(r=>r.status==='rejected');
      if(progressDraft===current&&!Object.keys(current.slots).length)clearProgressDraft();
      if(feedback.isConnected)feedback.textContent=failed?(failed.reason?.message||'Foto non leggibile.'):(files.length>order.length?feedback.textContent:'');
      if(slotsHost.isConnected)paintDraft();
      else if(document.getElementById('poseSlots'))renderProgressi();
    }
    save.onclick=async()=>{
      const current=progressDraft; if(!current||!owner)return;
      progressSaving=true;
      const entries=POSE.map(([k])=>k).filter(k=>current.slots[k]);
      feedback.textContent=`Caricamento di ${entries.length} foto…`;
      paintDraft();
      try{
        const {saveProgressPhoto}=await photosModule();
        const done=[];
        for(const key of entries){ await saveProgressPhoto(owner,current.batch,key,current.slots[key].blob); done.push(key); }
        if(progressDraft===current)clearProgressDraft();
        if(feedback.isConnected)feedback.textContent=entries.length===1?'Foto condivisa con il PT.':'Foto condivise con il PT.';
      }catch{
        if(feedback.isConnected)feedback.textContent='Caricamento non riuscito. Riprova: le foto già caricate non verranno doppiate.';
      }finally{
        progressSaving=false;
        if(slotsHost.isConnected){paintDraft();void loadOwnPhotos();}
        else if(document.getElementById('poseSlots'))renderProgressi();
      }
    };
    cancel.onclick=()=>{clearProgressDraft();feedback.textContent='';paintDraft();};
    function paintGroups(host,photos){
      import('./src/progress-photo-groups.mjs').then(({groupProgressPhotos,POSE_LABELS})=>{
        if(!host.isConnected)return;
        const groups=groupProgressPhotos(photos);
        host.className='progress-groups';
        host.replaceChildren();
        for(const group of groups){
          const sec=document.createElement('article');
          sec.className='progress-group';
          const date=Number.isFinite(group.date.getTime())?progressPhotoDate.format(group.date):'Foto di progresso';
          sec.innerHTML=`<div class="pg-head"><h4></h4><button type="button" class="pg-del" aria-label="Elimina le foto del ${esc(date)}">${I.trash}</button></div><div class="pg-row"></div>`;
          sec.querySelector('h4').textContent=date;
          const row=sec.querySelector('.pg-row');
          for(const photo of group.photos){
            const label=photo.pose?POSE_LABELS[photo.pose]:'';
            const cell=document.createElement('button');
            cell.type='button'; cell.className='pg-photo';
            cell.innerHTML=`<img alt="" loading="lazy">${label?`<span>${label}</span>`:''}`;
            const img=cell.querySelector('img'); img.alt=(label||'Foto')+' del '+date;
            signed(photo.path).then(url=>{ if(!cell.isConnected)return; img.src=url; cell.onclick=()=>apriFotoGrande(url,[label,date].filter(Boolean).join(' · ')); }).catch(()=>{img.alt='Anteprima non disponibile';});
            row.append(cell);
          }
          const del=sec.querySelector('.pg-del');
          del.onclick=async()=>{

  function mediaMobile(arr, giorni){
    return arr.map((p,i)=>{
      const fin=p.ts, ini=fin-giorni*86400000;
      const win=arr.filter((q,j)=>j<=i && q.ts>=ini);
      return {ts:p.ts, v:win.reduce((a,b)=>a+b.v,0)/win.length};
    });

  function buildPesoChart(arr){
    const W=320,H=160,L=40,R=12,T=12,B=26, pw=W-L-R, ph=H-T-B;
    const mm=mediaMobile(arr,7);
    const vals=arr.map(d=>d.v).concat(mm.map(d=>d.v));
    let mn=Math.min(...vals), mx=Math.max(...vals);
    if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*0.18; mn-=pad; mx+=pad;
    const t0=arr[0].ts, t1=arr[arr.length-1].ts, span=(t1-t0)||1;
    const X=ts=> L + (arr.length===1?pw/2:((ts-t0)/span)*pw);
    const Y=v=> T + (1-(v-mn)/(mx-mn))*ph;
    let grid=''; const NT=4;
    for(let k=0;k<=NT;k++){ const val=mn+(mx-mn)*k/NT, y=Y(val); grid+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/><text x="${L-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted2)" font-weight="700">${val.toFixed(1)}</text>`; }
    const raw=arr.map(d=>`<circle cx="${X(d.ts).toFixed(1)}" cy="${Y(d.v).toFixed(1)}" r="2.6" fill="var(--line)"/>`).join('');
    const pts=mm.map(d=>({x:X(d.ts), y:Y(d.v)}));
    const line=smoothPath(pts);
    const area=line+` L${pts[pts.length-1].x.toFixed(1)},${(T+ph).toFixed(1)} L${pts[0].x.toFixed(1)},${(T+ph).toFixed(1)} Z`;
    let xl=''; const step=Math.max(1, Math.ceil(arr.length/5));
    arr.forEach((d,i)=>{ if(i%step!==0 && i!==arr.length-1) return; xl+=`<text x="${X(d.ts).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted2)" font-weight="700">${fmtData(d.ts)}</text>`; });
    const last=pts[pts.length-1];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}<path d="${area}" fill="rgba(var(--accent-rgb),.13)"/>${raw}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/>${xl}</svg>`;
  }

  function smoothPath(pts){
    if(pts.length<2) return `M${pts[0].x},${pts[0].y}`;
    let d=`M${pts[0].x},${pts[0].y}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
      const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
      d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    }
    return d;
  }
  function buildChart(data){
    const W=320,H=150,L=40,R=12,T=12,B=26, pw=W-L-R, ph=H-T-B;
    const vals=data.map(d=>d.v); let mn=Math.min(...vals), mx=Math.max(...vals);
    if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
    const X=i=> L + (data.length===1?pw/2:(i/(data.length-1))*pw);
    const Y=v=> T + (1-(v-mn)/(mx-mn))*ph;
    const pts=data.map((d,i)=>({x:X(i),y:Y(d.v)}));
    const line=smoothPath(pts);
    const area=line+` L${pts[pts.length-1].x.toFixed(1)},${(T+ph).toFixed(1)} L${pts[0].x.toFixed(1)},${(T+ph).toFixed(1)} Z`;
    let grid=''; const NT=4;
    for(let k=0;k<=NT;k++){ const val=mn+(mx-mn)*k/NT, y=Y(val); grid+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/><text x="${L-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted2)" font-weight="700">${val.toFixed(1)}</text>`; }
    let xl=''; const step=data.length>6?2:1;
    data.forEach((d,i)=>{ if(i%step!==0 && i!==data.length-1) return; xl+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted2)" font-weight="700">${d.l}</text>`; });
    const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}<path d="${area}" fill="rgba(var(--accent-rgb),.13)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>`;
  }

  function computeAndShow(){
    const a=plicheAge, s=plicheSex, v=plicheVals;
    const sum7=v.petto+v.ascellare+v.tricipite+v.sottoscapolare+v.addome+v.soprailiaca+v.coscia;

    if(s==='M'){ sum3=v.petto+v.addome+v.coscia; bd3=1.10938-0.0008267*sum3+0.0000016*sum3*sum3-0.0002574*a; bd7=1.112-0.00043499*sum7+0.00000055*sum7*sum7-0.00028826*a; }
    else { sum3=v.tricipite+v.soprailiaca+v.coscia; bd3=1.0994921-0.0009929*sum3+0.0000023*sum3*sum3-0.0001392*a; bd7=1.097-0.00046971*sum7+0.00000056*sum7*sum7-0.00012828*a; }
    const bf3=495/bd3-450, bf7=495/bd7-450, diff=Math.abs(bf3-bf7), avg=(bf3+bf7)/2;
    const out=document.getElementById('plOut'); if(!out) return;

  function iniziali(){ const n=(profilo.nome||'').trim(), c=(profilo.cognome||'').trim(); return ((n[0]||'')+(c[0]||'')).toUpperCase() || 'LP'; }
  function aggiornaAvatar(){

  // Foto profilo: ritagliata al centro, 256×256, JPEG leggero (resta nei dati del cliente e segue l'account).
  function fotoProfiloDa(file){
    return new Promise((ok,ko)=>{
      if(!/^image\//.test(file.type||'')) return ko(new Error('formato'));
      const url=URL.createObjectURL(file), img=new Image();
      img.onload=()=>{
        const lato=Math.min(img.naturalWidth,img.naturalHeight); if(!lato){ URL.revokeObjectURL(url); return ko(new Error('vuota')); }
        const c=document.createElement('canvas'); c.width=c.height=256;
        c.getContext('2d').drawImage(img,(img.naturalWidth-lato)/2,(img.naturalHeight-lato)/2,lato,lato,0,0,256,256);
        URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error('lettura')); };
      img.src=url;
    });
  }
  function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  const biaDateFormat=new Intl.DateTimeFormat('it-IT',{dateStyle:'medium',timeStyle:'short'});
  const biaChangeFormat=new Intl.NumberFormat('it-IT',{signDisplay:'exceptZero',minimumFractionDigits:1,maximumFractionDigits:1});
  function biaNumber(value){
    if(typeof value!=='number'&&(typeof value!=='string'||!value.trim()))return null;
    const number=Number(value);
    return Number.isFinite(number)?number:null;
  }
  function formatBia(value,digits=1){
    return biaNumber(value)?.toLocaleString('it-IT',{minimumFractionDigits:digits,maximumFractionDigits:digits})??'—';
  }
  function orderedBiaRecords(){

      .sort((a,b)=>Date.parse(b.measuredAt)-Date.parse(a.measuredAt));

  function biaLeanMass(record){
    const saved=biaNumber(record?.fatFreeMassKg);
    if(saved!==null)return saved;
    const weight=biaNumber(record?.weightKg), fat=biaNumber(record?.bodyFatMassKg);
    return weight>0&&fat!==null&&fat>=0&&fat<weight ? weight-fat : null;
  }

  const biaMainMetrics=[
    ['Peso',record=>record.weightKg],

  const biaDetailFields=[

  function biaDetailsHTML(record,includeMain=false){
    const values=biaDetailFields.map(([key,label,unit,digits])=>[label,record[key],unit,digits]);
    if(includeMain)values.unshift(...biaMainMetrics.map(([label,read])=>[label,read(record),'kg',1]));
    const rows=values.filter(([,value])=>biaNumber(value)!==null).map(([label,value,unit,digits])=>

    return rows?`<dl class="bia-details-list">${rows}</dl>`:'';

  function biaProfileHTML(records){
    const [latest,previous]=records;
    if(!latest)return '<p class="bia-empty">Le misure compariranno qui quando il PT caricherà il primo referto BIA.</p>';
    const time=record=>`<time datetime="${new Date(record.measuredAt).toISOString()}">${biaDateFormat.format(new Date(record.measuredAt))}</time>`;
    const cards=biaMainMetrics.map(([label,read],index)=>{
      const value=biaNumber(read(latest));
      if(value===null)return '';
      const before=previous&&index<3?biaNumber(read(previous)):null;
      const change=before===null?'':`<dd class="bia-change">${biaChangeFormat.format(value-before)} kg dal referto precedente</dd>`;
      return `<div class="bia-value"><dt>${label}</dt><dd>${formatBia(value)} <small>kg</small></dd>${change}</div>`;
    }).join('');
    const details=biaDetailsHTML(latest);
    const history=records.slice(1).map((record,index)=>{
      return `<details class="bia-history-item"><summary>${time(record)}</summary>
        ${biaDetailsHTML(record,true)||'<p class="bia-empty">Nessun valore disponibile.</p>'}
        ${biaReportButton(record,index+1)}</details>`;
    }).join('');
    return `<div class="bia-profile-head"><div><h3>Ultima rilevazione BIA</h3>${time(latest)}</div>${biaReportButton(latest,0)}</div>
      ${cards?`<dl class="bia-summary">${cards}</dl>`:'<p class="bia-empty">Nessun valore principale disponibile per questo referto.</p>'}
      ${details?`<details class="bia-details"><summary>Altri valori del referto</summary>${details}</details>`:''}
      ${history?`<div class="bia-history"><h3>Storico rilevazioni</h3>${history}</div>`:''}`;
  }

  function bindBiaReportButtons(records){
    view.querySelectorAll('[data-bia-report]').forEach(button=>button.onclick=async()=>{
      button.disabled=true;
      try{
        const {getCoachFile}=await import('./src/athlete-coach-sections.mjs');
        const url=await getCoachFile('bia-reports',records[Number(button.dataset.biaReport)].reportPath);
        if(button.isConnected)location.assign(url);
      }catch{
        if(button.isConnected)toastMsg('Referto non disponibile. Riprova.');
      }finally{button.disabled=false;}
    });
  }

    const fold=document.getElementById('athleteAlertFold'); if(fold) fold.open=true;
    document.getElementById('athleteAlertHeading')?.scrollIntoView({block:'start'});

  function renderProfilo(){
    const foto=fotoValida();
    view.innerHTML=`
      <div class="pagetitle">Profilo</div>
      <div class="pf-avatar"><div class="av${foto?' has-photo':''}" id="pfAv" role="button" tabindex="0" aria-label="Cambia foto profilo"${foto?` style="background-image:url('${foto}')"`:''}>${iniziali()}<div class="cam">${I.camsmall}</div></div></div>
      <input type="file" id="pfFoto" accept="image/*" hidden>
      ${foto?'<button type="button" class="pf-foto-via" id="pfFotoVia">Rimuovi foto</button>':''}
      <div class="pf-field"><label>Nome</label><input class="pf-input" id="pfNome" value="${esc(profilo.nome)}" autocomplete="given-name"></div>
      <div class="pf-field"><label>Cognome</label><input class="pf-input" id="pfCogn" value="${esc(profilo.cognome)}" autocomplete="family-name"></div>
      <div class="pf-field"><label>Lingua</label><div class="pf-input sel">Italiano 🇮🇹 <span class="chev">▼</span></div></div>
      <button class="btn-accent" id="save">Salva</button>
      <div class="pf-save-status" id="profileSaveStatus" role="status" aria-live="polite"></div>

      <div class="pf-sec">Colore</div>
      <div class="col-grid">${ACCENTI.map(a=>`<button class="col${accento===a.id?' on':''}" data-col="${a.id}" title="${a.nome}"><span style="background:${a.hex}"></span></button>`).join('')}</div>
      <div class="col-nome">${(ACCENTI.find(a=>a.id===accento)||ACCENTI[0]).nome}</div>

      <div class="pf-sec">Timer di recupero</div>
      <div class="pf-row" style="border-bottom:0; padding-bottom:0"><div class="t">Volume</div></div>
      <div class="vol-row"><input type="range" id="pfVol" min="10" max="100" step="5" value="${volTimer}" aria-label="Volume del timer"><span class="vol-v" id="pfVolV">${volTimer}%</span><button class="vol-prova" id="pfVolProva">Prova</button></div>

      <div class="pf-sec">Impostazioni</div>
      <div class="pf-row"><div class="t">Tema scuro</div><button class="tgl${tema==='scuro'?' on':''}" id="pfTema"></button></div>
      <details class="pf-fold" id="athleteAlertFold">
        <summary class="pf-sec" id="athleteAlertHeading">Notifiche <span class="pf-fold-i">${I.chevR}</span></summary>
        <div class="bk-card" id="athleteAlertSettings" aria-labelledby="athleteAlertHeading"></div>
      </details>
      <div class="pf-link danger" id="pfReset">${I.trash} Cancella tutti i dati</div>
      <h2 class="pf-sec" id="profileAccountHeading">Account</h2>
      <section class="bk-card profile-account" aria-labelledby="profileAccountHeading">
        <div><div class="bk-l">Email di accesso</div><div class="bk-v">${esc(window.__LIPPOLIS_PROFILE__?.email)}</div></div>
        <button type="button" class="bk-b" id="accountPassword">Cambia password</button>
      </section>`;

    const fotoIn=document.getElementById('pfFoto'), avBtn=document.getElementById('pfAv');
    avBtn.onclick=()=>fotoIn.click();
    avBtn.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fotoIn.click(); } };
    fotoIn.onchange=async()=>{
      const file=fotoIn.files&&fotoIn.files[0]; if(!file) return;
      try{ profilo.foto=await fotoProfiloDa(file); saveStateNow(); aggiornaAvatar(); renderProfilo(); toastMsg('Foto profilo aggiornata'); }
      catch(error){ toastMsg('Non riesco a leggere questa immagine. Prova con un\'altra foto.'); }
    };
    const fotoVia=document.getElementById('pfFotoVia');
    if(fotoVia) fotoVia.onclick=()=>{ delete profilo.foto; saveStateNow(); aggiornaAvatar(); renderProfilo(); };
    window.lippolisAlerts?.mount(document.getElementById('athleteAlertSettings'));
    const sv=document.getElementById('save');
    sv.onclick=async()=>{
      const first=document.getElementById('pfNome').value.trim(), last=document.getElementById('pfCogn').value.trim(), status=document.getElementById('profileSaveStatus');
      if(!first||!last){ status.textContent='Inserisci nome e cognome.'; status.classList.add('error'); return; }
      sv.disabled=true; sv.textContent='Salvataggio…'; status.textContent=''; status.classList.remove('error');
      try{
        if(!window.lippolisAccount||!window.lippolisAccount.updateProfile) throw new Error('Connessione account non pronta. Riprova tra qualche secondo.');
        await window.lippolisAccount.updateProfile({nome:first,cognome:last});
        profilo.nome=first; profilo.cognome=last; saveStateNow(); aggiornaAvatar();
        const av=view.querySelector('.pf-avatar .av'); if(av) av.firstChild.textContent=iniziali();
        sv.textContent='✓ Salvato'; status.textContent='Nome e cognome aggiornati sul tuo account.';
      }catch(error){ sv.textContent='Errore'; status.textContent=error.message||'Non è stato possibile salvare i dati. Riprova.'; status.classList.add('error'); }
      finally{ setTimeout(()=>{ if(sv.isConnected){ sv.disabled=false; sv.textContent='Salva'; } },1800); }
    };
    view.querySelectorAll('[data-col]').forEach(b=> b.onclick=()=>{ accento=b.dataset.col; applicaAccento(); saveStateNow(); renderProfilo(); renderNav(); });
    document.getElementById('pfTema').onclick=()=>{ tema = tema==='scuro' ? 'chiaro' : 'scuro'; applicaTema(); saveStateNow(); renderProfilo(); };
    const pv=document.getElementById('pfVol'), pvv=document.getElementById('pfVolV');
    pv.oninput=()=>{ volTimer=+pv.value; pvv.textContent=volTimer+'%'; };
    pv.onchange=()=>{ volTimer=+pv.value; saveStateNow(); riapplicaVolume(); };
    document.getElementById('pfVolProva').onclick=()=>{ ensureAudio(); provaSuono(); };
    document.getElementById('accountPassword').onclick=window.lippolisOpenPassword;
    document.getElementById('pfReset').onclick=()=>{
      if(!confirm('Cancellare tutti i dati salvati su questo telefono? Allenamenti, check-in, pesate e foto andranno persi.')) return;
      if(!confirm('Ultima conferma: l\'operazione non si può annullare. Vuoi continuare?')) return;
      bloccaSalvataggi = true;
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      cancellaCopieNative().then(()=>location.reload());
    };

  // ====== STATO DELL’ATLETA ======
  function snapshot(){
    return { v:1, app:'lippolis-pt-atleta', esportato:Date.now(), bia:biaRecords, PROGRAMMA, versioneSchedaLocale, statoSett, noteSessione, sessioni, profilo, abitudini, giornate, pesi, thread, diario, differite, tema, accento,
      progressi, plicheVals, plicheSex, plicheAge, metriche: metriche.map(m=>({nome:m.nome, dati:m.dati})), seqIdx, giornoCorr, volTimer };
  }

  // ====== PERSISTENZA LOCALE (offline-first) ======
  // Il workout in corso, i check-in, i pesi e i messaggi sopravvivono a chiusura app,
  // schermo bloccato o connessione assente. Supabase sincronizza alla riconnessione.
  let ACCOUNT_UID = (()=>{ try{return sessionStorage.getItem('lippolis_uid')||'anonymous';}catch(e){return 'anonymous';} })();
  let LS_KEY = 'lippolis_pt_atleta_v1_'+ACCOUNT_UID.replace(/[^a-zA-Z0-9_-]/g,'_');
  let _saveT = null;
  let bloccaSalvataggi = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  function saveStateNow(){
    if(bloccaSalvataggi) return;
    clearTimeout(_saveT); _saveT=null;
    try{
      const _txt=JSON.stringify({
        v:1, salvato:Date.now(), PROGRAMMA, versioneSchedaLocale, statoSett, noteSessione, sessioni, profilo, tema, accento, abitudini, giornate, pesi, thread, diario, differite, bia:biaRecords, progressi, plicheVals, plicheSex, plicheAge,
        metriche: metriche.map(m=>({nome:m.nome, dati:m.dati})), seqIdx, giornoCorr, volTimer
      });
      scriviCopiaNativa(_txt);
      localStorage.setItem(LS_KEY, _txt);
      if(window.lippolisCloudSync) window.lippolisCloudSync.queue(JSON.parse(_txt));
      const b=document.getElementById('syncBadge');
      if(b){ b.textContent='Salvato su questo dispositivo'; b.style.background=''; b.classList.add('show'); clearTimeout(saveStateNow._t); saveStateNow._t=setTimeout(()=>b.classList.remove('show'), 1200); }
    }catch(e){}
  }
  function saveState(){ clearTimeout(_saveT); _saveT=setTimeout(saveStateNow, 400); }

  // ====== COPIA NATIVA (solo APK) ======
  // Il localStorage della WebView scrive su disco in differita: se Android chiude l'app di colpo
  // (aggiornamento, poca memoria, app in background) gli ultimi minuti possono andare persi.
  // Ogni salvataggio va quindi anche su file interni dell'app, alternando due copie (se una si rompe
  // a metà scrittura resta l'altra). All'avvio vince la copia più recente fra file e localStorage.
  let COPIE=['stato_'+ACCOUNT_UID+'_a.json','stato_'+ACCOUNT_UID+'_b.json'];
  let _copiaIdx=0, _copiaIn=false, _copiaPend=null, recuperoFatto=false;
  function fsNativo(){ try{ const C=window.Capacitor; if(C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Filesystem) return C.Plugins.Filesystem; }catch(e){} return null; }
  function scriviCopiaNativa(txt){
    const F=fsNativo(); if(!F) return;
    _copiaPend=txt; if(_copiaIn) return; _copiaIn=true;
    const giro=()=>{ const d=_copiaPend; _copiaPend=null; const p=COPIE[_copiaIdx]; _copiaIdx=1-_copiaIdx;
      Promise.resolve().then(()=>F.writeFile({path:p, data:d, directory:'DATA', encoding:'utf8'})).catch(()=>{})
        .then(()=>{ if(_copiaPend!=null) giro(); else _copiaIn=false; }); };
    giro();
  }
  function cancellaCopieNative(){ const F=fsNativo(); if(!F) return Promise.resolve(); return Promise.all(COPIE.map(p=>Promise.resolve().then(()=>F.deleteFile({path:p, directory:'DATA'})).catch(()=>{}))); }
  async function recuperaCopiaNativa(){
    const F=fsNativo(); if(!F){ recuperoFatto=true; bloccaSalvataggi=false; return; }
    // rete di sicurezza: se il file system non risponde, dopo 3" si torna a salvare normalmente
    const paracadute=setTimeout(()=>{ if(!recuperoFatto){ recuperoFatto=true; bloccaSalvataggi=false; } }, 3000);
    let migliore=null;
    for(const p of COPIE){ try{ const r=await F.readFile({path:p, directory:'DATA', encoding:'utf8'}); const d=JSON.parse(r.data); if(d && d.v===1 && (!migliore || (d.salvato||0)>(migliore.salvato||0))) migliore=d; }catch(e){} }
    let locale=0; try{ const l=JSON.parse(localStorage.getItem(LS_KEY)||'null'); locale=(l && l.salvato)||0; }catch(e){}
    if(migliore && (migliore.salvato||0)>locale){
      try{ localStorage.setItem(LS_KEY, JSON.stringify(migliore)); window.lippolisAthleteApi?.applySnapshot(migliore); }catch(e){}
    }
    clearTimeout(paracadute);
    try{ sessionStorage.removeItem('lpt_recupero'); }catch(e){}
    if(recuperoFatto) return;
    recuperoFatto=true; bloccaSalvataggi=false; saveStateNow();
  }
  function loadState(source){
    try{
      let d=source;
      if(d===undefined){ const raw=localStorage.getItem(LS_KEY); if(!raw) return false; d=JSON.parse(raw); }
      if(!d || d.v!==1) return false;
      if(Object.hasOwn(d,'PROGRAMMA'))PROGRAMMA=d.PROGRAMMA && Array.isArray(d.PROGRAMMA.settimane) && d.PROGRAMMA.settimane.length ? d.PROGRAMMA : PROGRAMMA_DEFAULT;
      if(Object.hasOwn(d,'versioneSchedaLocale'))versioneSchedaLocale=typeof d.versioneSchedaLocale==='string'?d.versioneSchedaLocale:'';
      if(d.statoSett && typeof d.statoSett==='object') statoSett=d.statoSett;
      if(d.noteSessione && typeof d.noteSessione==='object') noteSessione=d.noteSessione;
      if(Array.isArray(d.sessioni)) sessioni=d.sessioni;
      if(d.profilo) profilo=Object.assign({nome:'',cognome:''}, d.profilo);
      if(d.tema==='scuro'||d.tema==='chiaro') tema=d.tema;
      if(typeof d.volTimer==='number' && d.volTimer>=10 && d.volTimer<=100) volTimer=d.volTimer;
      if(d.accento) accento = ACCENTI.some(a=>a.id===d.accento) ? d.accento : 'lippolis';
      if(Array.isArray(d.abitudini) && d.abitudini.length) abitudini=d.abitudini;
      abitudini.forEach(a=>{ if(a.id==='acqua' && /litri/i.test(a.nome)) a.nome='Acqua a target'; });
      if(d.giornate && typeof d.giornate==='object') giornate=d.giornate;
      // vecchi check-in 1-5 convertiti nel nuovo formato
      if(Array.isArray(d.checkins)) d.checkins.forEach(c=>{ const k=dayKey(c.ts); if(!giornate[k]) giornate[k]={h:{}, sonnoOre:null, sonnoQ:(c.sonno||0)*2, energia:c.energia, motivazione:c.motivazione, doms:c.doms, zona:c.zona}; });
      if(Array.isArray(d.pesi)) pesi=d.pesi;
      if(Array.isArray(d.bia)) biaRecords=d.bia;
      if(Array.isArray(d.thread)) thread=d.thread;
      if(Array.isArray(d.diario)) diario=d.diario;
      if(Array.isArray(d.differite)) differite=d.differite;
      if(Array.isArray(d.progressi)) progressi=d.progressi;
      if(d.plicheVals&&typeof d.plicheVals==='object'){
        plicheVals=Object.fromEntries(PL_SITES.map(([key])=>[key,Math.max(0,valoreSerie(d.plicheVals[key])??0)]));
      }
      if(d.plicheSex) plicheSex=d.plicheSex;
      if(d.plicheAge!=null) plicheAge=Math.max(0,valoreSerie(d.plicheAge)??0);
      if(Array.isArray(d.metriche)) d.metriche.forEach(sm=>{ const m=metriche.find(x=>x.nome===sm.nome); if(m && Array.isArray(sm.dati)) m.dati=sm.dati; });
      if(typeof d.seqIdx==='number') seqIdx=d.seqIdx;
      if(typeof d.giornoCorr==='number') giornoCorr=d.giornoCorr;
      return true;
    }catch(e){ return false; }
  }
  window.addEventListener('beforeunload', saveStateNow);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveStateNow(); });

  function gestisciIndietro(){
    const gm=document.getElementById('gModal');
    if(gm && gm.style.display==='flex'){ chiudiGiorno(); return true; }
    const sg=document.getElementById('sgModal');
    if(sg && sg.style.display==='flex'){ const b=sg.querySelector('.sg-back'); if(b) b.click(); return true; }
    const ex=document.getElementById('execModal');
    if(ex && ex.style.display!=='none'){ closeExec(); return true; }
    const b=view.querySelector('.dhead .back');
    if(b){ b.click(); return true; }
    if(activeTab==='coach' && coVista!=='home'){ coVista='home'; renderView(); return true; }
    if(activeTab!=='workout'){ showTab('workout'); return true; }
    return false;
  }
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
    const A=window.Capacitor.Plugins.App;
    A.addListener('backButton', ()=>{ if(!gestisciIndietro()){ saveStateNow(); A.minimizeApp(); } });
    A.addListener('pause', saveStateNow);
  }

  let accountDefaults = null;
  window.lippolisAthleteApi = {
    get storageKey(){ return LS_KEY; },
    flushPendingSave: ()=>{ if(_saveT)saveStateNow(); },
    snapshot: ()=>{ try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')||snapshot();}catch(e){return snapshot();} },
    switchAccount: (uid)=>{
      const next=String(uid||'').replace(/[^a-zA-Z0-9_-]/g,'_'); if(!next) return false;
      if(next===ACCOUNT_UID) return false;
      if(_saveT)saveStateNow();
      const nextKey='lippolis_pt_atleta_v1_'+next;
      let cached=null; try{ cached=JSON.parse(localStorage.getItem(nextKey)||'null'); }catch(e){}
      ACCOUNT_UID=next; LS_KEY=nextKey; COPIE=['stato_'+next+'_a.json','stato_'+next+'_b.json'];
      try{ sessionStorage.setItem('lippolis_uid',uid); }catch(e){}
      nutrition={plan:null,state:'loading'}; coachSections={}; workoutView='list'; storicoEx=null;
      const defaults=structuredClone(accountDefaults);
      loadState({...defaults,...(cached?.v===1?cached:{})});
      impostaSettimana(settimanaPerData(Date.now())); ricalcolaUltimi(); applicaTema(); aggiornaAvatar(); renderView();
      return true;
    },
    applySnapshot: (value)=>{
      if(!value || typeof value!=='object') return false;
      const previousProgram=PROGRAMMA, oldVersion=versioneSchedaLocale, oldWeek=settCorr, oldDay=giornoCorr, oldScroll=view.scrollTop;
      const hasProgram=Object.hasOwn(value,'PROGRAMMA');
      const newVersion=hasProgram?(value.PROGRAMMA?String(window.__LIPPOLIS_PROGRAM_VERSION__||''):''):oldVersion;
      const data={...snapshot(), ...value, versioneSchedaLocale:newVersion};
      if(value.PROGRAMMA===null) data.PROGRAMMA=PROGRAMMA_DEFAULT;
      const samePlan=JSON.stringify(data.PROGRAMMA)===JSON.stringify(previousProgram);
      if(samePlan && !oldVersion && newVersion){
        data.statoSett={...(data.statoSett||{})}; data.noteSessione={...(data.noteSessione||{})};
        for(const [key,week] of Object.entries(data.statoSett)) if(/^\d+$/.test(key) && !data.statoSett['v:'+newVersion+':'+key])data.statoSett['v:'+newVersion+':'+key]=week;
        for(const [key,note] of Object.entries(data.noteSessione)) if(/^\d+-\d+$/.test(key) && !Object.hasOwn(data.noteSessione,'v:'+newVersion+':'+key))data.noteSessione['v:'+newVersion+':'+key]=note;
      }
      const changed=!samePlan || (oldVersion!==newVersion && !!oldVersion);
      data.salvato=Number(data.salvato||Date.now());
      data.giornoCorr=changed?0:oldDay;
      try{ localStorage.setItem(LS_KEY,JSON.stringify(data)); }catch(e){}
      loadState(data); applicaTema();
      if(changed || senzaScheda()){ workoutView='list'; storicoEx=null; }
      impostaSettimana(!changed && PROGRAMMA.settimane[oldWeek]?oldWeek:settimanaPerData(Date.now())); ricalcolaUltimi(); aggiornaAvatar(); renderNav();
      if(!document.getElementById('poseSlots'))renderView();
      view.scrollTop=changed&&activeTab==='workout'?0:oldScroll;
      return true;
    },
    applyNutrition: (value)=>{ nutrition=value; if(activeTab==='consigli')renderConsigli(); },
    applyCoachSections: (value)=>{
      coachSections=value||{};
      if(activeTab==='altro'&&altroDetail==='Progressi fisici')updateSharedProgressPhotos?.();
      else if(activeTab==='consigli'||(activeTab==='altro'&&altroDetail)||activeTab==='workout'&&workoutView==='detail'&&!view.contains(document.activeElement))renderView();
    },
    addBiaRecord: (record)=>{ if(!record||typeof record!=='object') throw new Error('Rilevazione BIA non valida.'); biaRecords.push(record); saveStateNow(); return record; },
    openChat: ()=>showTab('coach'),
    openWorkout: ()=>showTab('workout'),
    setProgressPhotoOwner: uid=>{
      progressPhotoOwner=uid;
      if(activeTab==='altro'&&altroDetail==='Progressi fisici')renderProgressi();
    },
    isChatOpen: ()=>activeTab==='coach'&&coVista==='home',
    setChatCoach: name=>{
      chatCoachName=String(name);
      const heading=document.getElementById('chatCoachName');
      if(heading){
        heading.textContent=chatCoachName;
        view.querySelector('.co-av').textContent=chatCoachName.split(/\s+/).slice(0,2).map(w=>w[0]).join('');
      }
    },
    applyMessages: (messages)=>{
      thread=messages.filter(x=>x.channel==='thread');
      diario=messages.filter(x=>x.channel==='diary');
      differite=messages.filter(x=>x.channel==='deferred');
      try{ const d=window.lippolisAthleteApi.snapshot(); d.thread=thread; d.diario=diario; d.differite=differite; d.salvato=Date.now(); localStorage.setItem(LS_KEY,JSON.stringify(d)); }catch(e){}
      const log=document.getElementById('coThread');
      if(activeTab==='coach'&&coVista==='home'&&log){
        const atBottom=view.scrollHeight-view.scrollTop-view.clientHeight<90;
        dipingiThread(log);
        if(atBottom)view.scrollTop=view.scrollHeight;
        markCoachRead();
      }else if(activeTab==='coach'&&coVista==='home')renderCoach();
      renderNav();
    }
  };

  // ====== AVVIO ======
  accountDefaults=structuredClone(snapshot());
  loadState();
  applicaTema();
  if(PROGRAMMA===PROGRAMMA_DEFAULT){
    (function importaStorico(){ const ids=new Set(sessioni.map(x=>x.id)); SEED_SESSIONI.forEach(x=>{ if(!ids.has(x.id)) sessioni.push(x); }); })();
    (function importaTracker(){ Object.keys(SEED_GIORNATE).forEach(k=>{ if(!giornate[k]) giornate[k]=JSON.parse(JSON.stringify(SEED_GIORNATE[k])); }); })();
  }
  impostaSettimana(settimanaPerData(Date.now()));
  recuperaCopiaNativa();
  ricalcolaUltimi();
  aggiornaAvatar();
  // Chiede al browser di non sfrattare mai questi dati quando il telefono ha poco spazio
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  seedThread();
  renderNav();
  renderView();
