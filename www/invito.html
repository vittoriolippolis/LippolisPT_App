<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Lippolis PT · Crea account</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#edf5f2;color:#13211f;font:16px system-ui,sans-serif}
    main{width:min(100%,460px);padding:clamp(22px,6vw,36px);border:1px solid #d4e2de;border-radius:24px;background:white;box-shadow:0 16px 40px #143d2f14}
    .brand{font-weight:900;letter-spacing:.04em}.brand span{color:#087560}h1{margin:16px 0 6px;font-size:28px}
    form{display:grid;gap:14px;margin-top:20px}form[hidden]{display:none}label{display:grid;gap:5px;font-weight:650;font-size:14px}
    input{min-width:0;width:100%;padding:11px;border:1px solid #bfcfca;border-radius:10px;font:inherit}
    button{padding:12px;border:0;border-radius:10px;background:#12c7a2;color:#05241d;font:800 16px system-ui;cursor:pointer}
    button:disabled{opacity:.6}p{font-size:14px;color:#425851;line-height:1.5}a{color:#087560}
  </style>
</head>
<body>
  <main>
    <div class="brand">LIPPOLIS <span>PT</span></div>
    <h1>Crea il tuo account</h1>
    <form id="registration" hidden>
      <label>Nome<input name="firstName" autocomplete="given-name" maxlength="60" required></label>
      <label>Cognome<input name="lastName" autocomplete="family-name" maxlength="60" required></label>
      <label>Data di nascita<input name="birthDate" type="date" autocomplete="bday" min="1900-01-01" required></label>
      <label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="passwordHint" required></label>
      <p id="passwordHint">Usa almeno 12 caratteri, con una maiuscola, una minuscola e un numero.</p>
      <button type="submit">Crea account</button>
    </form>
    <p id="inviteStatus" role="status">Verifica dell’invito…</p>
    <a href="index.html">Vai all’accesso</a>
  </main>
  <script src="supabase-config.js"></script>
  <script type="module" src="src/client-invite.mjs"></script>
</body>
</html>
